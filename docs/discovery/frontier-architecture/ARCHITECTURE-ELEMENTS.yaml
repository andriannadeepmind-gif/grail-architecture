      progress_or_variant: "finite session/fork/resource budget; timeout returns VIEW_ONLY/DEFERRED/CREATOR_REQUIRED"
    input_cut: "canonical model + status + evidence + authenticated steering proposal + creator identity"
    authority_path: "view has no authority; steering proposal simulated first; signed class-specific authority required"
    obligation_path: "delta/loss/rollback/re-evaluation obligations"
    resource_envelope: "interactive projection; heavy worlds queued under profile"
    success_predicate: "creator sees exact state and consequences; any accepted change is typed, signed, reversible where claimed and re-evaluated"
    terminal_states: [VIEW_ONLY, PROPOSED, APPLIED_PROVISIONAL, REJECTED, ROLLED_BACK, CREATOR_REQUIRED]
    failure_paths: [stale_projection, simulation_unavailable, class_ambiguity, authority_missing, patch_failure]
    compensation_or_degraded_mode: "canonical text/YAML fallback; preserve pre-change cut; never execute raw REPL text as ambient authority"
    evidence_receipts: [MFA-CON-032, MFA-CON-039, MFA-CON-079]
    fidelity_requirements: "F1 spatial projection/patch semantics; F2 steering simulations; real effects remain outside Cockpit"
    unknowns: [MFA-UNK-132, MFA-UNK-139]

