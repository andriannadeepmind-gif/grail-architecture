# OBJECTIVE-SPACE — ο πλήρης χώρος επιδιώξεων, οι αντιφάσεις του, το πλέγμα υποψηφίων Telos, το Pareto μέτωπο,
# epistemic_status (Ω-ASI 0.4.0 §5, MFA-PATCH-0038) για επιδιώξεις = κατάσταση του ισχυρισμού «η επιδίωξη προέρχεται από τον δημιουργό/το corpus»: stated/explicit→EMPIRICALLY SUPPORTED (υπάρχει το κείμενο), derived→NOVEL SYNTHESIS, proposed→RESEARCH HYPOTHESIS· η επιτευξιμότητα κρίνεται στους μηχανισμούς, όχι εδώ.
# ο χάρτης ευαισθησίας και το ανθεκτικό υπόστρωμα (εντολή Ω-MAXIMUM §4, Pass B).
# Copyright (c) 2026 STAVROPOULOS LAW. All Rights Reserved.
#
# Κανόνες αυτού του αρχείου:
#  - Κάθε επιδίωξη έχει provenance: explicit (γραμμένη), latent (συνεπάγεται από γραμμένη), new (πρώτες αρχές — δική μου προσθήκη).
#  - Καμία επιδίωξη δεν αφαιρείται· οι αντιφάσεις κρατούν και τις δύο πλευρές (CONFLICTS.yaml έχει τις συνθήκες επίλυσης).
#  - Το Telos ΔΕΝ κλειδώνεται εδώ. Η επιλογή του δημιουργού είναι patch RECLASSIFY (PATCH-PROTOCOL.md §5).
#  - Οι ικανότητες αναφέρονται με MFA-CAP-nnn (CAPABILITY-LATTICE.yaml).
#  - Τα στοιχεία έχουν τα 28 πεδία της εντολής §19· όπου ένα πεδίο δεν έχει νόημα για επιδίωξη, γράφεται null με τον λόγο στο schema_note.

schema_note: |
  Επιδίωξη (type: objective): interfaces/state_model/resource_model/authority είναι null — μια επιδίωξη δεν έχει διεπαφές,
  κατάσταση ή πόρους· έχει ικανότητες που απαιτεί (capabilities), μετρήσιμο κριτήριο (verification), διαψεύστη (falsifier)
  και το τι την αλλάζει (affected_by). Υποψήφιο Telos (type: telos-candidate): σύνολο επιδιώξεων + κανόνας σύνθεσης.
  Το «status: PROPOSED» ισχύει παντού μέχρι Creator Approval.

defaults: &defaults
  version: 1
  status: PROPOSED
  created_by: "Stavropoulos Law® — σχεδιαστική συνεδρία 2026-09-16 (εξαγωγή ή επινόηση, βλ. source_provenance)"
  interfaces: null
  state_model: null
  resource_model: null
  authority: null
  supersedes: []
  superseded_by: null
  change_history:
    - {patch: MFA-PATCH-0000, op: ADD, date: 2026-09-16, summary: "αρχική δημιουργία του πακέτου"}

# =====================================================================================================
# 1. ΕΠΙΔΙΩΞΕΙΣ
# =====================================================================================================
objectives:

  # ---- 1a. Ρητές: το Telos του προχείρου T0–T9 (spine-vocab.md:17, model/Telos.sysml) ---------------
  - id: MFA-OBJ-001
    <<: *defaults
    type: objective
    name: "T0 — Telos πολιτισμού ως σύζευξη T1…T9"
    maturity: stated
    statement: "Το GRAIL επιτυγχάνει T1…T9 ταυτόχρονα· η αποτυχία οποιουδήποτε T είναι αποτυχία του T0."
    purpose: "Να μην αγοράζεται ένα T με απώλεια άλλου (ΝΟΜΟΣ §7, Δ-8)."
    capabilities: [MFA-CAP-001, MFA-CAP-002]
    source_provenance: ["docs/architecture-draft/spine-vocab.md:17", "model/Telos.sysml (T0 conjunction, PROVISIONAL)"]
    provenance_kind: explicit
    assumptions: ["Τα T1…T9 είναι το πλήρες σύνολο — ΑΜΦΙΣΒΗΤΕΙΤΑΙ: βλ. MFA-OBJ-030…045 (νέες επιδιώξεις που λείπουν)"]
    dependencies: [MFA-OBJ-002, MFA-OBJ-003, MFA-OBJ-004, MFA-OBJ-005, MFA-OBJ-006, MFA-OBJ-007, MFA-OBJ-008, MFA-OBJ-009, MFA-OBJ-010]
    failure_modes: ["Σιωπηρή επαναπροσδιόριση ενός T από απόφαση στρώματος (DEC-X-04: FRG-05→T4, AEO-02→T2, LAW-01→T1, LAW-03→T7, EVO-03→T5)"]
    alternatives: ["Λεξικογραφικό Telos (T9 > T6 > …) — απορρίπτεται: τα T δεν είναι ανταλλάξιμα (ΝΟΜΟΣ §12)"]
    conflicts: [MFA-CFL-014]
    unknowns: [MFA-UNK-001]
    verification: "Κάθε T έχει όργανο μέτρησης (model/Instruments.sysml) και μετρημένη βάση· το T0 ισχύει όταν καμία μέτρηση δεν πέφτει κάτω από τη βάση της (non-diminution)."
    falsifier: "Ένα release όπου ένα T ανεβαίνει και άλλο πέφτει κάτω από τη μετρημένη βάση χωρίς εγγραφή στο Capability Conservation Ledger."
    evolution_path: "Το σύνολο των T μεγαλώνει με patch ADD (νέο T) — ποτέ δεν συρρικνώνεται· βλ. MFA-TEL-08."
    affected_by: [MFA-TEL-01, MFA-TEL-02, MFA-TEL-03, MFA-TEL-04, MFA-TEL-05, MFA-TEL-06, MFA-TEL-07, MFA-TEL-08]
    epistemic_status: "EMPIRICALLY SUPPORTED"
    version: 2
    change_history: [{patch: MFA-PATCH-0000, op: ADD, date: 2026-09-16, summary: "αρχική δημιουργία του πακέτου"}, {patch: MFA-PATCH-0038, op: ANNOTATE, date: "2026-09-16", summary: "Πεδίο epistemic_status σε κάθε επιδίωξη MFA-OBJ-001…052 (AA-017)"}]

  - id: MFA-OBJ-002
    <<: *defaults
    type: objective
    name: "T1 — Κατανόηση και κρίση"
    maturity: stated
    statement: "Το σύστημα κατανοεί (μοντέλο του κόσμου, αιτίες, αντιπαραδείγματα) και κρίνει (αποφασίζει με λόγο που αντέχει έλεγχο) σε κάθε πεδίο στο οποίο δρα."
    purpose: "Η κρίση, όχι η παραγωγή κειμένου, είναι η μονάδα αξίας (MATERIAL-SYNTHESIS §7 #8 HOLDS)."
    capabilities: [MFA-CAP-013, MFA-CAP-014, MFA-CAP-015, MFA-CAP-016, MFA-CAP-068, MFA-CAP-010]
    source_provenance: ["spine-vocab.md:17 T1", "MATERIAL-SYNTHESIS.md §7 #8"]
    provenance_kind: explicit
    assumptions: ["Η κατανόηση είναι μετρήσιμη μέσω αντιπαραδειγμάτων και αιτιακών παρεμβάσεων, όχι μόνο ακρίβειας"]
    dependencies: [MFA-OBJ-007]
    failure_modes: ["Υποκατάσταση κρίσης από επιφανειακή συσχέτιση (retrieval-then-paraphrase)"]
    alternatives: ["Μόνο ακρίβεια σε benchmark — απορρίπτεται: μετρά μέσο, όχι κατανόηση"]
    conflicts: [MFA-CFL-004]
    unknowns: []
    verification: "KT-14 (null baseline), KT-15 (κορυφαία ανθρώπινη ομάδα), KT-24 (ablation ανά όργανο)· όργανο μέτρησης UnderstandingMeasured (Instruments.sysml)"
    falsifier: "Ισοδύναμη επίδοση με μηδενική εναλλακτική (KT-14) υπό ίσα δεδομένα και προϋπολογισμό"
    evolution_path: "Νέες μορφές κρίσης (π.χ. συνηγορική, MFA-OBJ-023) προστίθενται ως τύποι ισχυρισμού, όχι ως χαλάρωση του T1"
    affected_by: [MFA-TEL-01]
    epistemic_status: "EMPIRICALLY SUPPORTED"
    version: 2
