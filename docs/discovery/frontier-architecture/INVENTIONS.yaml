  - {<<: *d, id: MFA-MECH-032, name: "Genesis Grammar (G_Ω) — μία γεννητική γραμματική για γλώσσες, δρώντες, θεσμούς και αρχιτεκτονικές", maturity: X, dossier: mechanisms/MFA-MECH-032.md,
