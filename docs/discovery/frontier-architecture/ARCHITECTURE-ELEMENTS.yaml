      - {phase_id: register, provider: MFA-ELM-044, input_type: ConflictRecord, precondition: "parties/evidence identified", contract: MFA-CON-013, obligations: ["preserve both sides", "burdens"], budget: court, timeout: declared, effect_class: NONE, output_type: Proceeding, evidence: RegistrationReceipt, failure_transition: incomplete}
