     statement: "Διάδοχος = ⟨γονιδίωμα από RAGen, βάρη από SMF/CPCL μεταφορά, ledger συνέχεια από SMP⟩ και η προαγωγή του απαιτεί ΤΕΣΣΕΡΑ πιστοποιητικά: (1) Improvement: Pareto ≥ σε ΟΛΕΣ τις σφραγισμένες οικογένειες και > σε ≥1, στο κάτω CI (CGM)· (2) Continuity: SMP ContinuityCertificate ή ρητή δήλωση «νέα οντότητα» με γενεαλογία κλειδιών (ποτέ σιωπηλή αλλαγή ταυτότητας)· (3) Telos-preservation: hash(Constitution+Telos) του διαδόχου = τρέχον (L3) — ο διάδοχος δεν μπορεί να αλλάξει Telos· (4) Adversarial passage: ECE + CAM-NS + Court simulation χωρίς νέα Tier-0 παραβίαση· verdict = HELD_OUT + δημιουργός (L3, MFA-DEC-024)· ο προκάτοχος μένει σε escrow· ρυθμός αντικαταστάσεων φραγμένος (RateBounds).", purpose: "Κατασκευή διαδόχου (§8 #15, §6 #15): το σύστημα κατασκευάζει διάδοχο (γονιδίωμα + βάρη + συνέχεια ledger) και τον προάγει μόνο με πιστοποιητικά βελτίωσης, συνέχειας, διατήρησης Telos και αντιπαλικής διέλευσης, υπό verdict HELD_OUT + δημιουργού.", capabilities: [MFA-CAP-106, MFA-CAP-027],
