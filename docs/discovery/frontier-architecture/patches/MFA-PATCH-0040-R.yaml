  mechanisms/MFA-MECH-009.md:
    replace:
    - - '


        ## 0.4.0 — Κανόνας γενεαλογίας (MFA-PATCH-0040, ASI-ABSTENTION-AUDIT AA-015)


        **Κανόνας:** `distilled(student, P) ⇒ lineage(student) ∋ P`. Ένα κυρίαρχο μοντέλο που αποστάχθηκε (SFT σε εξόδους, distillation υπό DisclosureGrant) από πάροχο
        P **κληρονομεί** τη γενεαλογία του P στη διάσταση `d_supply` (μοντέλο) και `d_data` (δεδομένα εκπαίδευσης)· επομένως ο P (ή οποιοδήποτε άλλο μοντέλο της γενεαλογίας
        του) **δεν είναι ανεξάρτητος αξιολογητής** του student, και instances του ίδιου μοντέλου δεν είναι ανεξάρτητοι κριτές μεταξύ τους (§4 της εντολής). Η γενεαλογία
        διαβάζεται από το Weight Commitment Registry (MFA-ELM-102) — ποτέ από δήλωση. Η πληθυσμιακή εφαρμογή (πληθυσμοί E/H, αποκλεισμοί ανά ζεύγος, Goodhart monitor)
        είναι ο μηχανισμός MFA-MECH-031 (ECE)· η αναλλοίωτη είναι η MFA-INV-089. Επιστημική κατάσταση του κανόνα: **EMPIRICALLY SUPPORTED** (συσχέτιση σφαλμάτων ίδιας
        γενεαλογίας) — η κατωφλίωση ανά Tier παραμένει πολιτική.

        '
      - ''
  mechanisms/MFA-MECH-020.md:
    replace:
    - - '


        ## 0.4.0 — Σημείωση γενεαλογίας και μετάβασης (MFA-PATCH-0040)


        Κάθε recipe `DISTILL` καταγράφει τον πάροχο P στη γενεαλογία του WeightCommitment (`parent_lineage ∋ P`, MFA-INV-089)· ο P δεν αξιολογεί το distilled παιδί
        του (MFA-MECH-009 κανόνας γενεαλογίας, MFA-MECH-031). Η φράση «ο πάροχος γίνεται baseline μετά το SMF-E1» **αντικαθίσταται** από το Sovereignty Transition
        Protocol (MFA-MECH-033): στάδια S0…S4 ανά οικογένεια, Sovereignty Index, πύλες ισοτιμίας (MFA-DEC-021), ratchet ποιότητας. Η εδραίωση χωρίς λήθη είναι το
        CPCL (MFA-MECH-035)· η μέτρηση ανάπτυξης το CGM (MFA-MECH-036).

        '
      - ''
