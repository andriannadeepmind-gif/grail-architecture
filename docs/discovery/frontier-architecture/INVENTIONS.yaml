  - {<<: *d, id: MFA-MECH-034, name: "Substrate Migration Protocol (SMP) — μετανάστευση με ContinuityCertificate και escrow", maturity: X, dossier: mechanisms/MFA-MECH-034.md,
     statement: "Μετανάστευση = refinement mapping ImplMap: S_old → S_new που διατηρεί (α) το commitment log bitwise (hash chain ισότητα), (β) τη γενεαλογία κλειδιών (νέα κλειδιά επικυρώνονται από τα παλιά ΚΑΙ αντίστροφα — αμφίδρομη cross-attestation με epoch), (γ) τη συμπεριφορική ταυτότητα σε σφραγισμένα KT (bisimulation έως ανοχή ανά κλάση εκτέλεσης D1/D2), (δ) τις αναλλοίωτες διάταξης/χρόνου (event ordering, clock invariants)· η μεταγωγή (cutover) είναι IRREVERSIBLE-PREAUTHORIZED με escrow: το παλιό υπόστρωμα μένει ζωντανό και αυθεντικό μέχρι ContinuityCertificate από HELD_OUT + δημιουργό (MFA-DEC-023)· μέχρι τότε rollback = επιστροφή στο παλιό χωρίς απώλεια.", purpose: "Μετανάστευση υποστρώματος (§8 #19): μεταφορά ολόκληρης της οντότητας (ledger, κλειδιά, βάρη, όργανα, χρόνος) σε νέο hardware/OS/runtime/κρυπτογραφία με αποδείξιμη συνέχεια ταυτότητας, αναστρέψιμη μέχρι το πιστοποιητικό.", capabilities: [MFA-CAP-098, MFA-CAP-036],
