  design: 'DST: από 3 specs παράγονται μια μίνι-γλώσσα (LexDSL παραλλαγή + compiler), ένας δρών με charter, ένας θεσμός με proceeding· τρέχουν KT-10, KT-18, KT-11'
  preregistered_criterion: 3/3 derivations + instantiations με ενεργά contracts· KT PASS· 0 παραβιάσεις μονοτονίας εξουσίας
- id: GG-E2
  design: Έργο μη εκφράσιμο στην αρχική P· το σύστημα προτείνει p′· GG-Extend· έργο λύνεται
  preregistered_criterion: p′ εισάγεται με VFC+Galois+drill PASS και το έργο λύνεται· 0 προτάσεις που αγγίζουν P_L3 γίνονται δεκτές
falsifiers:
- 'GG-E1: αδυναμία derivation ενός από τα τρία είδη με την ενιαία γραμματική (τότε η ενοποίηση διαψεύδεται· οι τρεις διαδρομές μένουν)'
- 'GG-E2: καμία επιτυχής αυτο-επέκταση σε 2 δόσεις'
