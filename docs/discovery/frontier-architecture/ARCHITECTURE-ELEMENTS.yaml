    entry: "measured capability/debt/unknown landscape"
    phases:
      - {phase_id: propose, provider: MFA-ELM-104, input_type: CapabilityLandscape, precondition: "target and protected floors explicit", contract: MFA-CON-049, obligations: ["improvement hypothesis", "loss map"], budget: search, timeout: declared, effect_class: NONE, output_type: ImprovementCandidate, evidence: ProposalReceipt, failure_transition: no_change}
      - {phase_id: build_shadow, provider: MFA-ELM-113, input_type: ImprovementCandidate, precondition: "L0-L2 only", contract: MFA-CON-058, obligations: ["lineage", "rollback", "L3 exclusion"], budget: build, timeout: declared, effect_class: NONE, output_type: ShadowCandidate, evidence: BuildReceipt, failure_transition: discard}
      - {phase_id: adversarial_verify, provider: MFA-ELM-114, input_type: ShadowCandidate, precondition: "independent evaluator set", contract: MFA-CON-078, obligations: ["counterexamples", "Goodhart/collusion", "CI/debt"], budget: evaluation, timeout: declared, effect_class: NONE, output_type: PromotionEvidence, evidence: IndependentVerdictReceipt, failure_transition: reject}
      - {phase_id: decide_promote, provider: MFA-ELM-048, input_type: PromotionEvidence, precondition: "all gates and authority present", contract: MFA-CON-014, obligations: ["appeal", "rollback", "post-promotion watch"], budget: governance, timeout: declared, effect_class: CANARY, output_type: ImprovementDisposition, evidence: ProceedingReceipt, failure_transition: reject_or_creator}
    control_flow:
      graph: "propose → build_shadow → adversarial_verify → [reject/defer/creator | decide_promote canary → watch/rollback]"
      data_dependencies: ["ImprovementCandidate→ShadowCandidate→PromotionEvidence is type-continuous", "protected floors and incumbent are immutable retained bindings"]
      forks: ["proposal distribution and independent attacks/evaluators form bounded parallel branches"]
      joins: ["adversarial_verify joins lower-confidence bounds, protected-floor results, independence and integration-debt horizon"]
      loops: ["each admitted L0-L2 improvement starts a new measured epoch; L3 is outside the loop; search rounds are budget-bounded"]
      cancellation: "candidate branches cancel with falsifier/residue retained; canary cancellation rolls back to incumbent"
      progress_or_variant: "finite proposal/evaluation budgets and mandatory terminal receipt per branch; no branch waits on its own promotion"
    input_cut: "architecture/model/evaluator/target cut"
    authority_path: "self-proposal has zero promotion authority; independent Court/Creator gates"
    obligation_path: "proof/loss/debt/rollback obligations linear"
    resource_envelope: "bounded RVSI search and evaluation"
    success_predicate: "scoped improvement admitted with CI, protected-floor report, debt/recovery horizon and rollback"
    terminal_states: [PROMOTED_CANARY, REJECTED, DEFERRED, CREATOR_REQUIRED, ROLLED_BACK]
    failure_paths: [self_certification, verifier_overlap, hidden_loss, L3_touch, recovery_miss]
    compensation_or_degraded_mode: "retain incumbent and all candidate evidence; rollback on missed horizon"
    evidence_receipts: [MFA-CON-049, MFA-CON-078, MFA-CON-079]
    fidelity_requirements: "F1 protocol; F2 adversarial simulation; F3 shadow/canary; no universal improvement proof claimed"
    unknowns: [MFA-UNK-113, MFA-UNK-137]
  - thread_id: MT-06
