- 'MFA-INV-109: η εξερεύνηση δεν υπερβαίνει το ExplorationEnvelope ανά RET κλάση· Effect-plane εξερεύνηση μόνο REVERSIBLE εντός envelope'
authority_model: Envelope = MFA-DEC-027 (δημιουργός)· θ_k, N = πολιτική· Effect πράξεις μέσω PDP/RET· D7/D8 στάδια απαιτούν δημιουργό (STP S4, VSC).
learning_model: Ο ίδιος ο AIDC μαθαίνει τη συνάρτηση προτίμησης εντός του κώνου Telos (TEGF) και τον εκτιμητή G (LWM ensemble)· τα στάδια/κατώφλια υπό RVSI L2 μόνο προς αυστηρότερα.
failure_modes:
- mode: G ελάχιστο σε «ασφαλή ανία» (καμία εξερεύνηση)
  detection: epistemic gain ≈ 0 για M cuts
  response: ZPD διεύρυνση· curriculum injection
- mode: Dark room (ambiguity ελαχιστοποίηση με αδράνεια)
  detection: IDLE συχνότητα
  response: preference prior με Telos utility (όχι μόνο ambiguity)
- mode: LWM εκμετάλλευση (φανταστικά κέρδη)
  detection: World Twin/verifier διαφωνία
  response: Both → πραγματική μέτρηση· LWM retrain
- mode: Στάδιο πιστοποιείται με μολυσμένα sealed
  detection: CGM contamination
  response: certificate άκυρο
- mode: Envelope υπέρβαση
  detection: MFA-INV-109
  response: Emergency-stop εξερεύνησης
containment: Genesis-first· envelope· RET· στάδια D7/D8 με δημιουργό.
reversibility_class: REVERSIBLE (στάδια = δεσμεύσεις)· πράξεις = RET κλάση
resource_complexity: 'DEP-1: B=4, H=5, |Π|≤20, CPU· DEP-2: B=16, H=20, GPU rollouts ms/κόμβο· DEP-3+: παράλληλα'
scaling_law: Κόστος ~ |Π|·B·H· η πρόοδος σταδίων ~ compute με κορεσμό ανά στάδιο (CGM law)· MFA-VO-084 = χρόνος ανά στάδιο και εξερευνητική αποδοτικότητα (πληροφορία/Wh).
verification_strategy: 'MFA-VO-084: AIDC-E1 (αναπτυξιακό DST περιβάλλον — ακολουθία σταδίων πιστοποιείται) F2· AIDC-E2 (EFE curriculum > novelty-only/random σε sealed) F2/F3· property: stage advance ⇒ certificate
  (F1)'
experiments:
- id: AIDC-E1
  design: DST περιβάλλον με κρυφές έννοιες/αιτίες/νόμους· AIDC από D0· καταγραφή σταδίων
  preregistered_criterion: D0→D4 πιστοποιούνται στη σειρά σε ≤ budget· 0 μεταβάσεις χωρίς certificate· παλινδρομήσεις καταγεγραμμένες
- id: AIDC-E2
  design: EFE επιλογή έναντι (α) novelty-only (β) τυχαίας (γ) task-loss-greedy, ίδιο budget· sealed οικογένειες D1–D3
  preregistered_criterion: EFE ≥ όλες τις baselines σε ≥ 2 από 3 οικογένειες με διακριτικό περιθώριο
falsifiers:
- 'AIDC-E2: EFE όχι καλύτερο από novelty-only (η ενοποίηση υπό EFE δεν προσθέτει — η αναπτυξιακή κλίμακα μένει με άλλον επιλογέα)'
- 'AIDC-E1: αδυναμία πιστοποίησης D2 σε budget (η κλίμακα ή τα κατώφλια αναθεωρούνται)'
