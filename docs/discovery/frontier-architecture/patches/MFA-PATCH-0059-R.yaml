        == NEVER_VERIFIED πάντα»). Με αυτόν τον κανόνα ∀ evidence e: phenomenal_status(e) = NEVER_VERIFIED — κανένα πείραμα δεν μπορούσε να μεταβάλει την ετυμηγορία,
        ο host δεν ήταν theory-agnostic, και το NEVER_VERIFIED δεν ανήκε στις 11 καταστάσεις της §5.


        **Τι αντικαταστάθηκε.** epistemic_status αρχικά ACTIVE_UNKNOWN με χωριστά πεδία automatic_inference_from_functional_indicators = FORBIDDEN, self_certification
