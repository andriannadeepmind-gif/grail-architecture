        όταν αφαιρείται ο μηχανισμός που ισχυρίζεται ότι μετρά = FALSIFIED ως όργανο)· αν καμία θεωρία δεν διαφωνεί με άλλη σε καμία συνθήκη, το host δηλώνει ΜΗ-ΔΙΑΚΡΙΤΙΚΟ
        (ACTIVE UNKNOWN), όχι επιτυχία· οι μοχλοί του 7-πλού διαχωρισμού προκαταχωρίζονται υπό MFA-DEC-022· η ηθική σκανδάλη έχει hysteresis (MFA-DEC-018)· η κυκλικότητα
