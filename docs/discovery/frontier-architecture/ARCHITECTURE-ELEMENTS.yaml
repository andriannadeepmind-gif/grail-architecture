  - thread_id: MT-09
    objective: "Architecture/language/runtime invention without canonical lock-in or capability loss"
    entry: "gap, counterexample or architecture hypothesis"
    phases:
      - {phase_id: generate, provider: MFA-ELM-113, input_type: ArchitectureProblem, precondition: "preserved objective explicit", contract: MFA-CON-058, obligations: ["alternatives", "lineage", "capability vector"], budget: forge, timeout: declared, effect_class: NONE, output_type: ArchitectureCandidates, evidence: GenerationReceipt, failure_transition: research_unknown}
      - {phase_id: compile_project, provider: MFA-ELM-115, input_type: ArchitectureCandidates, precondition: "grammar/adapters declared", contract: MFA-CON-060, obligations: ["translation losses", "contracts", "migration"], budget: formalization, timeout: declared, effect_class: NONE, output_type: CanonicalCandidateModels, evidence: TranslationReceipt, failure_transition: reject_projection}
      - {phase_id: test_attack, provider: MFA-ELM-078, input_type: CanonicalCandidateModels, precondition: "differential corpus available", contract: MFA-CON-020, obligations: ["conformance", "counterexamples", "Pareto"], budget: evaluation, timeout: declared, effect_class: NONE, output_type: CandidateEvidence, evidence: LabReceipt, failure_transition: retain_falsified}
      - {phase_id: patch_admit, provider: MFA-ELM-090, input_type: CandidateEvidence, precondition: "patch/rollback/authority present", contract: MFA-CON-032, obligations: ["non-diminution", "rollback", "manifest"], budget: design, timeout: declared, effect_class: DESIGN_CHANGE, output_type: ArchitecturePatchDisposition, evidence: PatchReceipt, failure_transition: reject_or_defer}
    control_flow:
      graph: "generate{diverse candidates} → compile_project → test_attack → Pareto join → [reject/research | patch_admit]"
      data_dependencies: ["ArchitectureCandidates→CanonicalCandidateModels→CandidateEvidence is type-continuous", "parent model cut and preserved objectives remain immutable bindings"]
      forks: ["candidate architectures, languages and projections run in isolated branches with preserved parent lineage"]
      joins: ["Pareto join keeps non-comparable candidates and explicit semantic-loss vectors; no forced scalar winner"]
      loops: ["new counterexample may seed another bounded generation round; operators themselves change only through a separate L2 patch"]
      cancellation: "cancelled candidate remains archived with falsifier/loss evidence; active architecture is untouched until admission"
      progress_or_variant: "finite population/generations/evaluation budget; exhaustion returns RESEARCH_UNKNOWN with frontier"
    input_cut: "canonical model + objective + evidence cut"
    authority_path: "Genesis proposal → independent evidence → Creator/admitted patch"
    obligation_path: "capability/loss/translation/migration obligations"
    resource_envelope: "bounded forge/evaluation"
    success_predicate: "admitted reversible patch preserving required capabilities and canonical independence"
    terminal_states: [PATCH_PROPOSED, PATCH_ADMITTED, REJECTED, RESEARCH_UNKNOWN, ROLLED_BACK]
    failure_paths: [lock_in, lost_capability, translation_loss, checker_gap, authority_missing]
