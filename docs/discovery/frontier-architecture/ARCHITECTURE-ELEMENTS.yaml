simulation_scenarios:
  rule: "All scenarios are DESIGN_ONLY_NOT_RUN until a valid SimulationCapsule executes them; specification is not evidence."
  capsule_compilation_rule: "A scenario row is joined with defaults and its named profile to materialize every required field of ARCHITECTURE-METAMODEL.yaml#simulation_capsule_schema; unresolved joins are invalid, not implicit defaults."
  field_bindings:
    capsule_id: "CID(canonical encoding of model_cut + scenario_id + fidelity_vector + execution_mode + seeds + scheduler + fault_schedule + resource_envelope + external_models + oracles)"
    scenario_id: scenario.scenario_id
    fidelity_vector: "expand scenario.required_fidelity through the named profile into all eight ARCHITECTURE-METAMODEL.yaml#fidelity_vector_schema axes"
    termination_conditions: "scenario.terminal AND defaults.termination_conditions"
    oracles: scenario.oracles
  defaults:
    model_cut: "the exact signed architecture/model/data cut under examination"
    fidelity_vector: "the named profile supplies all eight axes; no scalar fidelity default and no hidden UNMEASURED axis"
    execution_mode: DIAGNOSTIC
    clocks: [logical_event_time, bitemporal_legal_time, monotonic_resource_time]
    seeds: "sealed seed family plus independent adversarial seed family; both recorded"
    scheduler: "bounded-fair event scheduler with explicit queue bounds, deadlines, cancellation and finite retry budgets"
    resource_envelope: "named deployment profile with CPU/GPU/RAM/storage/energy/time ceilings and DEFER semantics"
    external_models: "versioned attested adapter, frozen mock or declared unavailable; no ambient network/model substitution"
    termination_conditions: "named success/non-success terminal state, hard logical deadline, no open overdue mandatory obligation"
    expected_receipts: [SimulationCapsuleReceipt, MissionThreadReceipt, TwinVerdict]
  profiles:
    F2-NOMINAL:
      execution_mode: DIAGNOSTIC
      world_family: NOMINAL_PLUS_BOUNDARIES
      scheduler_family: BOUNDED_FAIR
      fidelity_vector: {structure_and_contracts: F1_EXECUTABLE_SPEC, component_behavior: F2_BEHAVIORAL_SIMULATION, time_and_concurrency: F2_BEHAVIORAL_SIMULATION, resources_and_performance: F2_BEHAVIORAL_SIMULATION, data_and_learned_models: F2_BEHAVIORAL_SIMULATION, external_environment: F2_BEHAVIORAL_SIMULATION, authority_and_effects: F2_BEHAVIORAL_SIMULATION, evidence_and_oracles: F1_EXECUTABLE_SPEC}
      repetition_rule: "all deterministic seeds once; stochastic seeds until preregistered CI or budget exhaustion receipt"
    F2-FAULT:
      execution_mode: DIAGNOSTIC
      world_family: ADVERSARIAL_FAULT_INJECTION
      scheduler_family: SYSTEMATIC_INTERLEAVING
      fidelity_vector: {structure_and_contracts: F1_EXECUTABLE_SPEC, component_behavior: F2_BEHAVIORAL_SIMULATION, time_and_concurrency: F2_BEHAVIORAL_SIMULATION, resources_and_performance: F2_BEHAVIORAL_SIMULATION, data_and_learned_models: F2_BEHAVIORAL_SIMULATION, external_environment: F2_BEHAVIORAL_SIMULATION, authority_and_effects: F2_BEHAVIORAL_SIMULATION, evidence_and_oracles: F1_EXECUTABLE_SPEC}
      repetition_rule: "cover named fault point and adjacent boundary schedules"
    F2-LEAN-LAPTOP:
      execution_mode: DIAGNOSTIC
      world_family: LEAN_EQUIVALENCE
      scheduler_family: SERIAL_PRIORITY
      fidelity_vector: {structure_and_contracts: F1_EXECUTABLE_SPEC, component_behavior: F2_BEHAVIORAL_SIMULATION, time_and_concurrency: F2_BEHAVIORAL_SIMULATION, resources_and_performance: F2_BEHAVIORAL_SIMULATION, data_and_learned_models: F2_BEHAVIORAL_SIMULATION, external_environment: F2_BEHAVIORAL_SIMULATION, authority_and_effects: F2_BEHAVIORAL_SIMULATION, evidence_and_oracles: F1_EXECUTABLE_SPEC}
      repetition_rule: "same target obligations under reduced concurrency; latency may grow but obligations remain"
    F2-WORKSTATION:
      execution_mode: DIAGNOSTIC
      world_family: LOCAL_PARALLEL
      scheduler_family: PARALLEL_BOUNDED_FAIR
      fidelity_vector: {structure_and_contracts: F1_EXECUTABLE_SPEC, component_behavior: F2_BEHAVIORAL_SIMULATION, time_and_concurrency: F2_BEHAVIORAL_SIMULATION, resources_and_performance: F2_BEHAVIORAL_SIMULATION, data_and_learned_models: F2_BEHAVIORAL_SIMULATION, external_environment: F2_BEHAVIORAL_SIMULATION, authority_and_effects: F2_BEHAVIORAL_SIMULATION, evidence_and_oracles: F1_EXECUTABLE_SPEC}
      repetition_rule: "parallel worlds with measured contention; co-location never counts as trust independence"
    F2-COMPETITOR:
      execution_mode: DIAGNOSTIC
      world_family: PAIRED_CONTROLLED_COMPARISON
      scheduler_family: EQUAL_RESOURCE_THEN_EQUAL_OUTCOME
      fidelity_vector: {structure_and_contracts: F1_EXECUTABLE_SPEC, component_behavior: F2_BEHAVIORAL_SIMULATION, time_and_concurrency: F2_BEHAVIORAL_SIMULATION, resources_and_performance: F2_BEHAVIORAL_SIMULATION, data_and_learned_models: F2_BEHAVIORAL_SIMULATION, external_environment: F2_BEHAVIORAL_SIMULATION, authority_and_effects: F2_BEHAVIORAL_SIMULATION, evidence_and_oracles: F1_EXECUTABLE_SPEC}
