        δεικτών αλλά ούτε αιώνια απαγορευμένο: απαιτεί ρητά admitted επιστημικό πρωτόκολλο, ανεξάρτητη κρίση, διακριτικά πειράματα και Creator Approval.


        **Τρία επίπεδα, χωριστά.** epistemic_status (τι υποστηρίζουν τα τεκμήρια) · ethical_policy (ποια προληπτική μεταχείριση υπό αβεβαιότητα — MFA-DEC-018/022)
