    name: No irreversible act without a live envelope or a fresh H1
    tier: 0
    delta: NEW
    statement: Καμία πράξη κλάσης IRREVERSIBLE δεν εκτελείται χωρίς (α) ζωντανό AutonomyEnvelope⟨matter, effect_class, window, max_exposure, conditions, counter_signer,
      expiry⟩ υπογεγραμμένο εκ των προτέρων από Principal/δημιουργό, μέσα στο παράθυρο και κάτω από max_exposure, ή (β) φρέσκο H1· το envelope είναι το αναστρέψιμο
      αντικείμενο (ανακαλείται μέχρι την πράξη)· η πράξη σημαίνεται μη αναστρέψιμη (MFA-INV-044 αμετάβλητο) (MFA-ATK-09).
    enforcement:
    - MFA-ELM-010
    - MFA-ELM-009
    - MFA-ELM-008
    verification:
    - MFA-VO-032
    falsifier: IRREVERSIBLE commit χωρίς envelope_cid ή H1· ή με envelope ληγμένο/ανακληθέν/υπέρβαση max_exposure
  MFA-ELM-010:
    effect_classes:
    - class: REVERSIBLE
      inverse: r⁻¹ ή ē προ-δεσμευμένο
      h1: false
    - class: IRREVERSIBLE
      inverse: NONE
      h1: πάντα (φρέσκο H1)
    - class: IRREVERSIBLE-PREAUTHORIZED
      inverse: NONE για την πράξη· το AutonomyEnvelope είναι το αναστρέψιμο αντικείμενο (ανάκληση μέχρι την πράξη)
      h1: ικανοποιείται από ζωντανό AutonomyEnvelope⟨matter, effect_class, window, max_exposure, conditions, counter_signer ∈ {δεύτερο σώμα με ανεξάρτητο κλειδί,
        Court fast-track με φραγμένο χρόνο}, expiry⟩ (MFA-INV-067)
    - class: DISCLOSE
      inverse: NONE
      h1: ικανοποιείται από DisclosureGrant⟨recipient, max_label, purpose, expiry⟩ (πολιτική PDP, δηλωμένο στην εισδοχή του παρόχου, ανακλητό)· ο Gateway επιβάλλει
        label(payload) ≤ grant.max_label (MFA-CAP-077)· κάθε κλήση = δέσμευση Disclose με hash του payload και receipt
    statement: 'MFA-MECH-006: proposal → inverse staged → shadow → diff → gate → commit → window· NONE ⇒ H1· ο κατάλογος ενεργειών με υποχρεωτική ανθρώπινη έγκριση
      (CLAIMS F16) = κλάσεις με inverse NONE ∪ Constitution-H1. · Κλάση DISCLOSE (MFA-ATK-05): η έξοδος πληροφορίας προς πάροχο/παραλήπτη εκτός sovereign boundary
      είναι επίδραση με inverse NONE και standing DisclosureGrant — το plane διαρρέει ΜΟΝΟ μέσω υπογεγραμμένου, σημασμένου καναλιού· «τοπικά μοντέλα» = grant με recipient=self
      (αναβάθμιση εμπιστευτικότητας). · Owner perimeter 6 βαθμίδων (MATERIAL §2 #14) ως τα επίπεδα των AutonomyGrant/Envelope (MFA-ATK-07). · Κλάση IRREVERSIBLE-PREAUTHORIZED
      (MFA-ATK-09): μη αναστρέψιμη πράξη με H1 ικανοποιημένο από προ-υπογεγραμμένο AutonomyEnvelope· το «23:50 filing» γίνεται δυνατό ΜΟΝΟ αν υπάρχει envelope — ο
      δημιουργός αποφασίζει στην υπογραφή (MFA-DEC-004).'
    failure_modes:
    - mode: inverse αποτυγχάνει
      response: αναταξινόμηση κλάσης + Court
    - mode: envelope λήγει στη μέση της πράξης
      response: abort πριν το commit· μετά το commit η πράξη μένει (μη αναστρέψιμη, σημασμένη) και ανοίγει Court
    - mode: envelope ανακλήθηκε μετά το staging
      response: abort· receipt της ανάκλησης
    - mode: υπέρβαση max_exposure
      response: deny + φρέσκο H1
  MFA-MECH-006:
    statement: 'Κάθε επίδραση: inverse (r⁻¹ ∨ ē) προ-δεσμευμένο → shadow → diff → gate → commit → window· NONE ⇒ H1. · Κλάση Disclose⟨payload_label, recipient, purpose⟩
      με DisclosureGrant (MFA-ATK-05). · Κλάση IRREVERSIBLE-PREAUTHORIZED με AutonomyEnvelope ως το αναστρέψιμο αντικείμενο (MFA-ATK-09).'
  MFA-CON-034:
    statement: propose(effect, inverse)/shadow/gate/commit→receipt/rollback/settle· inverse ∈ {r⁻¹, ē, NONE}· NONE ⇒ NEEDS_H1 ή (κλάση DISCLOSE) έγκυρο DisclosureGrant·
