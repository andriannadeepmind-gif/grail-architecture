  - {<<: *d, id: MFA-MECH-035, name: "Consolidation-Preserving Continual Learning (CPCL) — διπλή μνήμη με πύλη μη-υποχώρησης και unlearning-συμβατή εδραίωση", maturity: X, dossier: mechanisms/MFA-MECH-035.md,
     statement: "CLS μέσα στο κυρίαρχο όριο: επεισοδιακή μνήμη = ledger (μη-παραμετρική, τέλεια ανάκληση, provenance)· σημασιολογική = βάρη (WeightCommitments). Η εδραίωση είναι recipe SMF που (1) δειγματοληπτεί επεισόδια με βάρος provenance×surprise×recency ΑΠΟΚΛΕΙΟΝΤΑΣ shredded/obligated, (2) προβάλλει τις κλίσεις έξω από προστατευμένους υποχώρους ανά οικογένεια (Fisher blocks + MSM κυκλώματα), (3) αγκυρώνει συμπεριφορά (SLM αρνητικές + θετικές άγκυρες), (4) περνά πύλη: BWT_f ≥ −ε ∀f σε σφραγισμένα (HELD_OUT) ΚΑΙ FWT>0 κάπου ΚΑΙ unlearning verified (MSM feature absent) — ΠΡΙΝ το ORP merge· «ύπνος» = προγραμματισμένοι κύκλοι εδραίωσης από τον Ω-loop.", purpose: "Μεταφορά χωρίς καταστροφική λήθη (§8 #16) και συνεχής παραμετρική+μη-παραμετρική μάθηση (§8 #2): το σύστημα μαθαίνει διαρκώς με backward transfer ≥ −ε επαληθευμένο ΠΡΙΝ την προαγωγή, με unlearning υποχρεώσεις που η εδραίωση σέβεται.", capabilities: [MFA-CAP-099, MFA-CAP-066],
     source_provenance: ["EWC (Kirkpatrick et al. 2017)", "CLS (McClelland et al. 1995· Kumaran et al. 2016)", "GPM (Saha et al. 2021)", AA-024, "Ω-MAXIMUM NON-ABSTENTION MANDATE 0.4.0 (creator-authorized) §6/§7/§8", "inventions/MFA-MECH-035.yaml (29 πεδία)"], contribution: "CROSS-SOURCE SYNTHESIS", assumptions: ["Fisher-προβολή κλιμακώνει με K-FAC"],
     dependencies: [MFA-MECH-014], authority: "Ύπνος = Genesis· merge = ORP (πύλη + rollback)· ε_f, k_f = πολιτική (Tier-0 οικογένειες αυστηρότερες)· ο δημιουργός μπορεί να παγώσει οικογένειες.", alternatives: ["forgetting guard μόνο (0.4.0-provisional)", EWC-only],
