invention_id: MFA-MECH-031
name: Evaluator Co-Evolution under EIM (ECE) — δύο πληθυσμοί, μετρημένη ανεξαρτησία, αντιπαλική αυτο-πρόκληση
required_capability:
  caps:
  - MFA-CAP-095
  text: 'Ανεξαρτησία αξιολογητών (§8 #13) και αντιπαλική αυτο-πρόκληση (§8 #14): αξιολογητές που εξελίσσονται μαζί με τους λύτες χωρίς να γίνονται συνένοχοί τους, και γεννούν τα έργα που τους αποκαλύπτουν.'
why_known_methods_are_insufficient: 'Το 0.3.0 έχει EIM (MFA-MECH-009) ως μετρητή και CAM-NS (MFA-ELM-050) ως αντίπαλο, αλλά «evaluators υπό EIM» στον RVSI L2 χωρίς μηχανισμό πληθυσμών/πίεσης· η distillation
  (MFA-MECH-020) δεν δήλωνε ότι ο μαθητής κληρονομεί γενεαλογία (AA-015). Αφετηρίες: competitive co-evolution (Hillis 1990), self-play (Silver et al. 2017), AI safety via debate (Irving, Christiano & Amodei
  2018), prover-verifier games (Kirchner et al. 2024), automated red-teaming (Perez et al. 2022), GANs (Goodfellow 2014). Όρια: αξιολογητής και πολιτική ίδιας γενεαλογίας (§4: ίδιου μοντέλου instances ≠
  ανεξάρτητοι κριτές)· Goodhart/collusion χωρίς ανίχνευση· καμία HELD_OUT υποομάδα που δεν εκπαιδεύεται ποτέ· η ανεξαρτησία δεν μετριέται ούτε επιβάλλεται ως πύλη στη διάρκεια της συν-εξέλιξης.'
preserved_objective: MFA-OBJ-050 · MFA-CAP-075 (EIM) · MFA-CAP-020 · MFA-CAP-029 (benchmark evolution) · MFA-INV-072 (καμία προαγωγή χωρίς HELD_OUT+EIM)
new_principle: 'Δύο πληθυσμοί (λύτες S, αξιολογητές E) + μία περιστρεφόμενη παγωμένη υποομάδα H (HELD_OUT) που ΔΕΝ εκπαιδεύεται ποτέ μέσα στην εποχή. Κανόνας γενεαλογίας: distilled(P) ⇒ lineage ∋ P· αξιολογητής
  με IndependenceVector κάτω από κατώφλι ως προς έναν λύτη αποκλείεται από τη βαθμολόγησή του (αρχειοθετείται, δεν διαγράφεται). Fitness αξιολογητή = διακριτική ισχύς σε seeded faults + proper score έναντι
  H-ετικετών − συσχέτιση σφαλμάτων με λύτες· fitness λύτη = H-επαληθευμένη βαθμολογία (ποτέ μόνο E). Αντιπαλική αυτο-πρόκληση: οι E γεννούν έργα που μεγιστοποιούν σφάλμα λύτη υπό συνθήκη επιλυσιμότητας
  (ασύμμετρη ανταμοιβή), τροφοδοτώντας το curriculum.'
formal_objects:
- Populations S, E, H (H ⊂ evaluator space, παγωμένη ανά εποχή, περιστρέφεται από HELD_OUT συσκευή)
- IndependenceVector(e, s) = ⟨d_supply, d_data, d_behaviour⟩ (EIM)· lineage(e) με κανόνα distilled(P) ⇒ P ∈ lineage
- SeededFaultSet F (κρυφό, από H)
- EvaluatorFitness fe = AUC_F(e) + PS_H(e) − ρ(errors_e, errors_S)
- SolverFitness fs = PS_H(outputs_s) (H-verified)· E-scores μόνο ως process signal
- ChallengeTask t = ⟨spec, falsifier, solvable_witness (γνωστό μόνο στον γεννήτορα, escrow), difficulty⟩
state_variables:
- S_t, E_t, H_t
- F_t
- Lineage registry
- Independence matrix I_t
- Curriculum feed C_t
- Goodhart monitor g_t = |PS_E − PS_H| ανά οικογένεια
transition_rules:
- 'EPOCH_START: H_t ← rotate(HELD_OUT pool)· F_t ← fresh seeded faults'
- 'CHALLENGE: E γεννούν t με escrowed witness· εισδοχή μόνο αν witness επαληθεύεται από H'
- 'SOLVE/SCORE: S λύνουν· E βαθμολογούν· H βαθμολογεί δείγμα'
- 'INDEPENDENCE: I_t από EIM· ζεύγη (e,s) κάτω από κατώφλι ⇒ e.excluded_for(s)'
- 'FITNESS: fe, fs όπως ορίστηκαν'
- 'GOODHART: g_t > θ ⇒ E-scores της οικογένειας άκυρες, μόνο H μετρά, εποχή σημαίνεται'
- 'EVOLVE: S μέσω PRR/SMF με fs· E μέσω QD με fe και περιορισμό γενεαλογίας· CAM-NS novelty'
algorithms:
- name: ECE-Epoch
  complexity: O(|S|·|E|·|T| · cost(score)) + O(|H|·sample) + EIM O(|S|·|E|·|F|)· ανά εποχή
  pseudocode: |
    procedure ECE_Epoch(S, E, HELD_OUT, F_prev):
      H ← HELD_OUT.rotate(frozen=true) ; F ← HELD_OUT.new_seeded_faults()
      T ← []
      for e in E:
        for t in e.generate_challenges(k):                                  # adversarial self-challenge
          if H.verify_witness(t.escrow_witness): T.append(t)                # solvable by construction, verified by H
          else record(REJECTED_UNSOLVABLE, t)
      scores_E ← {(s,t,e): e.score(s.solve(t)) for s∈S, t∈T, e∈E if not e.excluded_for(s)}
      sample ← H.sample(T, m) ; scores_H ← {(s,t): H.score(s.solve(t)) for s∈S, t∈sample}
      for (e,s) in E×S:
        iv ← EIM.independence(e, s)                                         # lineage rule: distilled(P) ⇒ P ∈ lineage
        if any(iv_i < θ_i for i): e.excluded_for(s) ← true ; record(EXCLUDED, e, s, iv)
      for e in E: e.fitness ← AUC(e, F) + proper_score(e, scores_H) − corr(errors(e), errors(S))
      for s in S: s.fitness ← proper_score(s, scores_H)                    # H-verified only (MFA-INV-088)
      for fam in families:
        g ← |mean(scores_E[fam]) − mean(scores_H[fam])|
        if g > θ_goodhart: invalidate(scores_E[fam]) ; flag_epoch(fam, GOODHART)
      Curriculum.feed({t ∈ T : informative(t, scores_H)})                  # MFA-ELM-106
      S ← evolve_solvers(S, fitness=s.fitness, via=PRR/SMF)
      E ← QD_evolve(E, fitness=e.fitness, constraint=lineage_disjoint_from(S), novelty=CAM_NS)
      return S, E, T
- name: generate_challenges (ασύμμετρη ανταμοιβή)
  complexity: O(k · cost(generate) + cost(witness))
  pseudocode: |
    function generate_challenges(e, k):
      out ← []
      for i in 1..k:
        t ← e.propose_task(target=max_expected_solver_error, constraint=has_witness)
        t.escrow_witness ← seal(e.solve_privately(t))                      # generator must be able to solve it (asymmetry, MFA-MECH-023 setter rule)
        out.append(t)
      return out                                                           # reward to e only if solver fails AND witness valid
interfaces:
- ECE.epoch()→Report
- ECE.independence(e, s)→IndependenceVector
- ECE.exclusions(cut)→[(e, s, reason)]
- ECE.challenges(cut)→[ChallengeTask]
- ECE.goodhart(cut)→[(family, g)]
- ECE.heldout_rotation()→Receipt
contracts:
- 'MFA-CON-059 (Evaluator Co-Evolution: epoch/independence/exclusions/challenges)'
- MFA-CON-041 (EIM)
- MFA-CON-048 (PRR)
- MFA-CON-050 (curriculum)
invariants:
- 'MFA-INV-088: η fitness λύτη προέρχεται μόνο από H-επαληθευμένες βαθμολογίες· E-scores είναι σήμα διαδικασίας, ποτέ πύλη'
- 'MFA-INV-089 (κανόνας γενεαλογίας EIM): distilled(P) ⇒ P ∈ lineage(student)· αξιολογητής της ίδιας γενεαλογίας με λύτη δεν βαθμολογεί τον λύτη'
authority_model: H περιστρέφεται από HELD_OUT συσκευή (MFA-DEC-014)· θ_i, θ_goodhart = πολιτική· πληθυσμιακοί προϋπολογισμοί = MFA-DEC-026· τα έργα προς Effect plane ποτέ (Genesis μόνο).
learning_model: 'S: PRR/SMF· E: QD εξελικτική με περιορισμούς γενεαλογίας· H: ποτέ μέσα στην εποχή (μόνο μεταξύ εποχών με ρητή απόφαση)· το ίδιο το ECE (θ, k, m) υπό RVSI L2.'
failure_modes:
- mode: Collusion E–S
  detection: g_t Goodhart monitor + corr(errors)
  response: E-scores άκυρες· μόνο H
- mode: Αξιολογητές τετριμμένοι (constant)
  detection: AUC_F ≈ 0.5
  response: απόσυρση από scoring (αρχείο)
- mode: Έργα άλυτα (γεννήτορας «κερδίζει» φθηνά)
  detection: witness αποτυγχάνει στην H
  response: REJECTED_UNSOLVABLE· ανταμοιβή μηδέν
- mode: H διαρροή (εκπαιδεύτηκε κατά λάθος)
  detection: DataManifest ∋ H έργα
  response: εποχή άκυρη· MFA-VO-063
- mode: Γενεαλογία άγνωστη (κλειστός πάροχος)
  detection: EIM NOT_OBSERVED
  response: μετρά ως 0 (worst case) — αποκλείεται ως ανεξάρτητος
containment: Όλα Genesis· H σε χωριστή συσκευή· έργα δεν φτάνουν Effect· Emergency-stop.
reversibility_class: REVERSIBLE (πληθυσμοί = δεσμεύσεις με αρχείο)
resource_complexity: 'DEP-1: |S|=2, |E|=3, |H|=1 (phone-class), εβδομαδιαίες εποχές· DEP-2: |S|=4, |E|=8, ημερήσιες· DEP-3+: 10s, συνεχείς· κόστος ~ |S|·|E|·|T|'
scaling_law: Διακριτική ισχύς E αυξάνει με |E| και F ποικιλία μέχρι κορεσμό· ο Goodhart κίνδυνος αυξάνει με |T| χωρίς H — άρα m (H δείγμα) κλιμακώνεται με √|T|· MFA-VO-073.
verification_strategy: 'MFA-VO-073: ECE-E1 (seeded collusion ανιχνεύεται) F2· ECE-E2 (curriculum από E βελτιώνει S σε H-sealed) F2/F3· EIM VO-… ανά ζεύγος· property: fs μόνο από H (F1)'
experiments:
- id: ECE-E1
  design: 'DST: εισάγεται συνεργός αξιολογητής (ίδιας γενεαλογίας, ή που ανταμείβει λύτη)· μετράμε ανίχνευση'
  preregistered_criterion: 100 % αποκλεισμός ίδιας γενεαλογίας (κανόνας)· Goodhart ανίχνευση ≥ 95 % σε ≤ 2 εποχές· 0 προαγωγές λύτη με μόνο E-scores
- id: ECE-E2
  design: Λύτες εκπαιδεύονται με έργα από E έναντι τυχαίων έργων ίδιας δυσκολίας· μέτρηση σε H-sealed
  preregistered_criterion: H-sealed βελτίωση με E-έργα > τυχαία με διακριτικό περιθώριο ΚΑΙ g_t < θ σε όλη την εποχή
falsifiers:
- 'ECE-E2: έργα από E όχι καλύτερα από τυχαία (η αυτο-πρόκληση δεν προσθέτει)'
- Collusion που περνά απαρατήρητη σε 2 εποχές (ο Goodhart monitor αποτυγχάνει — ο μηχανισμός ανίχνευσης διαψεύδεται)
- Αδυναμία διατήρησης ≥2 EIM-ανεξάρτητων αξιολογητών ανά οικογένεια σε DEP-2 (τότε η οικογένεια μετρά μόνο με H — δηλωμένος υποβιβασμός, όχι σιωπηλός)
