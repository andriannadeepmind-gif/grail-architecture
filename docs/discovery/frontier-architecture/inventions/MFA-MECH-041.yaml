invention_id: MFA-MECH-041
name: Active-Inference Developmental Core (AIDC) — ένας στόχος για αντίληψη/δράση/μάθηση και μια πιστοποιημένη αναπτυξιακή κλίμακα
required_capability:
  caps:
  - MFA-CAP-105
  - MFA-CAP-085
  text: 'Developmental/open-ended learning υπό ενεργητική συμπερασματολογία (§6 #4, #9· §8 #7): εξερεύνηση με expected free energy πάνω στο μαθημένο κοσμομοντέλο, με Telos-διαμορφωμένες προτιμήσεις, αναπτυξιακά
    στάδια με πιστοποιημένες μεταβάσεις και όρια εξουσίας.'
why_known_methods_are_insufficient: 'Το 0.4.0-provisional OEC (MFA-MECH-023) έχει setter/solver + POET χωρίς αναπτυξιακή κλίμακα και χωρίς ενοποίηση υπό ενεργητική συμπερασματολογία (AA-030)· το TEGF έχει
  EFE ως φράγμα. Αφετηρίες: active inference (Friston 2010· Parr, Pezzulo & Friston 2022), intrinsic motivation (Schmidhuber 1991· Oudeyer, Kaplan & Hafner 2007), curiosity RL (Pathak et al. 2017), developmental
  robotics (Cangelosi & Schlesinger 2015), open-endedness (Stanley, Lehman & Soros 2017· OMNI, Zhang et al. 2023· Voyager, Wang et al. 2023), Piaget-class στάδια. Όρια: η ενεργητική συμπερασματολογία κλιμακώνει
  σε μικρούς χώρους καταστάσεων· τα στάδια είναι χειροποίητα χωρίς πιστοποίηση μετάβασης· η εξερεύνηση δεν υπόκειται σε RET/εξουσία· δεν ενοποιεί OGE/CDCE/AHE/TGPS/MSM ως ΣΤΑΔΙΑ ενός ίδιου βρόχου.'
preserved_objective: MFA-OBJ-058 (αναπτυξιακή ανοιχτή μάθηση) · MFA-OBJ-050 · MFA-CAP-085 · MFA-CAP-018 (βούληση) · MFA-TEL-08
new_principle: 'Ένας στόχος εξερεύνησης: expected free energy G(π) = risk(π) + ambiguity(π) υπολογισμένη με rollouts στο LWM (MFA-MECH-023), όπου οι προτιμήσεις (prior over outcomes) είναι ο κώνος του Telos
  + TEGF· η πολιτική με ελάχιστο G επιλέγεται στη ζώνη εγγύτερης ανάπτυξης του τρέχοντος σταδίου· η Developmental Ladder D0…D8 ορίζει στάδια ικανότητας (D0 ledger grounding → D1 concept permanence/OGE →
  D2 causal/CDCE → D3 hypothesis/AHE → D4 theory/TGPS → D5 self/MSM → D6 social/institutions → D7 sovereignty/STP → D8 successor/VSC) με ΠΙΣΤΟΠΟΙΗΜΕΝΕΣ μεταβάσεις (CGM records σε σταδιακές σφραγισμένες
  οικογένειες)· παλινδρόμηση επιτρέπεται και καταγράφεται· εξερεύνηση μόνο εντός RET/AutonomyEnvelope (MFA-DEC-027).'
formal_objects:
- Policy π (ακολουθία πράξεων Genesis/Effect)· G(π) = E_q[log q(s|π) − log p(o,s|π)] = risk + ambiguity (Parr et al.)
- Preference prior p(o) = softmax(Telos cone utility + TEGF)
- Stage D_k = ⟨competences, sealed families F_k, gate thresholds, allowed mechanisms⟩
- StageCertificate = ⟨k, CGM records ∀f∈F_k with lower_CI ≥ θ_k, HELD_OUT⟩
- 'ExplorationEnvelope (MFA-DEC-027): budgets ανά RET class ανά στάδιο'
- ZPD(k) = έργα με δυσκολία ∈ [θ̂ − δ, θ̂ + δ] στο στάδιο k
state_variables:
- k_t τρέχον στάδιο
- θ̂ ανά F_k
- π candidates & G
- Envelope usage
- Regression log
transition_rules:
- 'PLAN: candidates π από OEC/curriculum + AHE tests + CDCE interventions· G(π) με LWM rollouts (ensemble)'
- 'SELECT: arg min G υπό envelope· Genesis πρώτα'
- 'EXECUTE: πράξεις με RET· receipts'
- 'LEARN: SMF/PRR/CPCL/OGE/CDCE ενημερώσεις'
- 'CERTIFY: ∀f∈F_k lower_CI ≥ θ_k για N cuts ⇒ StageCertificate ⇒ k+1'
- 'REGRESS: CGM ratchet FAIL σε F_k ⇒ k−1 (καταγράφεται)'
- 'ENVELOPE: υπέρβαση ⇒ Emergency-stop της εξερεύνησης (όχι του συστήματος)'
algorithms:
- name: AIDC-Step
  complexity: O(|Π|·B·H) rollouts (B ensemble, H ορίζοντας)· φραγμένο από budget· ανά κύκλο Ω-loop
  pseudocode: |
    procedure AIDC_Step(k, LWM, Telos, envelope, CGM):
      Π ← candidate_policies(stage=k)                                      # from OEC tasks, AHE tests, CDCE interventions, curriculum
      Π ← {π ∈ Π : difficulty(π) ∈ ZPD(k) ∧ RET.class(π) allowed_by envelope}
      for π in Π:
        rollouts ← LWM.rollout(π, ensemble=B, horizon=H)
        risk ← KL(q(o|π) ∥ p(o | Telos, TEGF))                             # divergence from preferred outcomes
        ambiguity ← E_q[H(o | s, π)]                                       # expected observation entropy (epistemic value when low)
        G[π] ← risk + ambiguity − epistemic_gain(rollouts)                  # info gain over LWM/CDCE parameters
      π* ← argmin_π G[π]
      if π* = ⊥: return IDLE(reason=NO_POLICY_IN_ENVELOPE, plan=escalate_envelope)
      outcome ← execute(π*, plane=GENESIS_FIRST, ret=RET.class(π*)) ; envelope.consume(π*)
      learn(outcome)                                                       # SMF/PRR/CPCL + OGE/CDCE/AHE updates
      for f in F_k: rec[f] ← CGM.measure(f)
      if all(lower_CI(rec[f]) ≥ θ_k for f in F_k) for N consecutive cuts: k ← k + 1 ; CC.assert(StageCertificate(k, rec))
      elif any(RATCHET_FAIL(rec[f])): k ← max(0, k − 1) ; CC.assert(StageRegression(k, rec))     # never silent
      return k
interfaces:
- AIDC.step()→stage
- AIDC.stage()→(k, certificate)
- AIDC.candidates()→[(π, G)]
- AIDC.envelope()→usage
- AIDC.ladder()→[D_k specs]
- AIDC.regressions(cut)→log
