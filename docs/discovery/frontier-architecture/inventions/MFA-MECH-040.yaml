invention_id: MFA-MECH-040
name: Theorem-Guided Learning (TGL) — η επαληθευμένη βιβλιοθήκη και οι αναλλοίωτες ως περιορισμοί, curriculum και ανταμοιβή της μάθησης
required_capability:
  caps:
  - MFA-CAP-104
  text: 'Theorem-guided learning (§6 #10): η παραμετρική μάθηση καθοδηγείται από θεωρήματα — ως σκληροί/μαλακοί περιορισμοί στην έξοδο, ως συνθετικό curriculum με αποδείξεις-επίβλεψη, ως process reward
    — χωρίς ποτέ να παραβιάζει Tier-0 αναλλοίωτες.'
why_known_methods_are_insufficient: 'Το 0.4.0-provisional PRR (MFA-MECH-021) ανταμείβει επαληθευμένες εξόδους· δεν χρησιμοποιεί τα θεωρήματα ως περιορισμούς/curriculum (AA-028). Αφετηρίες: semantic loss
  (Xu et al. 2018), DeepProbLog (Manhaeve et al. 2018), Logic Tensor Networks (Badreddine et al. 2022), physics-informed NNs (Raissi et al. 2019), differentiable theorem proving (Rocktäschel & Riedel 2017),
  AlphaGeometry συνθετικά θεωρήματα (Trinh et al. 2024), constrained decoding με verifiers. Όρια: περιορισμοί χειρόγραφοι, όχι από τη δική του επαληθευμένη βιβλιοθήκη· κανένα curriculum από θεωρήματα →
  στιγμιότυπα με αποδείξεις ως επίβλεψη σε ΝΟΜΙΚΟ πεδίο· καμία διάκριση σκληρών (Tier-0, projected decoding) από μαλακών περιορισμών· η «συνέπεια με θεωρήματα» δεν μετριέται ως οικογένεια ανάπτυξης.'
preserved_objective: MFA-OBJ-056 · MFA-OBJ-051 · MFA-CAP-082 (PRR) · MFA-INV-072 · MFA-TEL-08
new_principle: 'Η επαληθευμένη βιβλιοθήκη (TGPS) και οι αναλλοίωτες (INVARIANTS ως Lean/εκτελέσιμα predicates) γίνονται ΤΡΕΙΣ μοχλοί μάθησης: (α) περιορισμοί — Tier-0 σκληροί (constrained decoding: κάθε
  δείγμα φιλτράρεται/προβάλλεται από verifier, παραβίαση = απόρριψη), λοιποί μαλακοί (semantic loss πάνω σε αποκωδικοποίηση στο κανονικό υπόστρωμα)· (β) curriculum — θεωρήματα → συνθετικά στιγμιότυπα με
  αποδείξεις ως επίβλεψη (AlphaGeometry-class), δυσκολία από CGM· (γ) ανταμοιβή — process reward (PRR) για βήματα που εκπληρώνουν υποχρεώσεις OC· η «θεωρηματική συνέπεια» είναι οικογένεια CGM με σφραγισμένα.'
formal_objects:
- Theorem set Θ_lib (από TGPS) με εκτελέσιμο έλεγχο ανά θεώρημα σε αποκωδικοποιημένη έξοδο
- Hard set H ⊆ Θ_lib (Tier-0 invariants)· Soft set S = Θ_lib \ H
- Semantic loss L_sem(y) = −log Σ_{ŷ ⊨ S} p(ŷ) (WMC-προσέγγιση ή δείγματα)
- Instance generator gen(θ) → (x, y, proof)· δυσκολία d(x) από CGM
- 'Constrained decoder: sample ~ p(·|x) υπό ⊨ H (rejection/projection με verifier στο IR)'
- Process reward r_t = 1[step t discharges an OC obligation]
state_variables:
- Θ_lib,t
- H_t, S_t
- Curriculum buffer
- Violation counters
- Consistency family record (CGM)
transition_rules:
- 'SYNC: Θ_lib ← TGPS.library(cut)· H ← Tier-0'
- 'GENERATE: για θ ∈ Θ_lib: instances (x, y, proof) με δυσκολία στη ζώνη εγγύτερης ανάπτυξης (CGM θ̂ ± δ)'
- 'TRAIN: batch με L = L_task + λ·L_sem(S) + PRR(process rewards)· δείγματα υπό H (constrained)'
- 'CHECK: παραβίαση H σε οποιοδήποτε δείγμα ⇒ δείγμα απορρίπτεται + counter· παραβίαση σε serving ⇒ INV incident'
- 'MEASURE: CGM οικογένεια consistency'
- 'GATE: ORP + CPCL gate (καμία υποχώρηση)'
algorithms:
- name: TGL-Batch
  complexity: 'gen O(|Θ|·k)· L_sem: WMC #P-hard — προσέγγιση με δειγματοληψία O(m·cost(check))· constrained decoding O(samples·verifier)'
  pseudocode: |
    procedure TGL_Batch(policy, Θ_lib, H, S, CGM, OC):
      θ̂ ← CGM.ability(policy, family=consistency)
      curriculum ← [gen(θ) for θ in Θ_lib for _ in 1..k if d(gen(θ)) ∈ [θ̂ − δ, θ̂ + δ]]        # zone of proximal development
      batch ← sample(curriculum ∪ ledger_tasks, n)
      loss ← 0 ; rewards ← []
      for (x, y, proof) in batch:
        ŷ, trace ← constrained_decode(policy, x, hard=H)                 # rejection/projection: never emits ŷ ⊭ H (MFA-INV-106)
        if ŷ = ⊥: violations[H] += 1 ; continue
        loss += L_task(ŷ, y) + λ · L_sem(ŷ, S)                            # soft theorems as semantic loss on decoded IR
        r ← [1 if OC.discharges(step, proof) else 0 for step in trace]     # process rewards from obligations
        rewards.append((trace, r))
      policy ← SMF.step(policy, loss) ; policy ← PRR.update(policy, rewards)   # both under KL MetaBound
      CGM.measure(policy, family=consistency)                             # sealed, HELD_OUT
- name: constrained_decode
  complexity: O(k_samples · (decode + verify(H)))
  pseudocode: |
    function constrained_decode(policy, x, hard):
      for i in 1..k_samples:
        ŷ, trace ← policy.sample(x)
        ir ← decode_to_canonical(ŷ)                                      # canonical substrate IR (TED)
        if all(check(h, ir) for h in hard): return ŷ, trace
      return ⊥, ⊥                                                         # rejection recorded; no output violating Tier-0
interfaces:
- TGL.sync(cut)→(Θ_lib, H, S)
- TGL.curriculum(policy)→instances
- TGL.batch(policy)→Receipt
- TGL.violations(cut)→counters
- TGL.consistency(policy)→CapabilityGrowthRecord
contracts:
- 'MFA-CON-065 (Theorem-Guided Learning: sync/curriculum/batch/violations)'
- MFA-CON-048 (PRR)
- MFA-CON-047 (SMF)
- MFA-CON-057 (TGPS library)
- MFA-CON-071 (OC)
invariants:
- 'MFA-INV-106: κανένα δείγμα/έξοδος εκπαίδευσης που παραβιάζει Tier-0 αναλλοίωτη δεν χρησιμοποιείται ή εκπέμπεται· constrained decoding με verifier είναι υποχρεωτικό για H'
- 'MFA-INV-107: τα συνθετικά στιγμιότυπα φέρουν την απόδειξή τους και το θεώρημα προέλευσης (provenance) — καμία «συνθετική αλήθεια» χωρίς απόδειξη'
authority_model: Genesis· H από Constitution (L3)· λ, δ, k = πολιτική υπό RVSI L2· ORP/CPCL gate για κάθε βάρος.
learning_model: 'Παραμετρική με συμβολική καθοδήγηση· η βιβλιοθήκη μεγαλώνει (TGPS) ⇒ curriculum μεγαλώνει (ανοιχτό)· self-play: το μοντέλο προτείνει conjectures → TGPS → νέα θεωρήματα → νέο curriculum.'
failure_modes:
- mode: Semantic loss ασύμβατη με task loss (σύγκρουση)
  detection: L_sem ↑ ενώ L_task ↓
  response: λ schedule· ORP gate· CFL
- mode: Curriculum τετριμμένο ή αδύνατο
  detection: CGM δυσκολία εκτός ζώνης
  response: δ προσαρμογή
- mode: Θεώρημα λάθος στη βιβλιοθήκη
  detection: VFC (αδύνατο αν 2 checkers)
  response: TGPS incident· batch απορρίπτεται
- mode: Rejection rate 100 % (H πολύ αυστηρό για το μοντέλο)
  detection: violations
  response: curriculum από ευκολότερα· ποτέ χαλάρωση H
- mode: Reward hacking των process rewards
  detection: OC discharge χωρίς πραγματική πρόοδο
  response: OC certs από ανεξάρτητους checkers
containment: Genesis· Tier-0 σκληρό· ORP/CPCL· KL φράγμα.
reversibility_class: REVERSIBLE (ORP)
resource_complexity: 'DEP-1: μικρές βιβλιοθήκες, rejection decoding CPU/GPU· DEP-2: 7–13B, WMC δειγματοληψία, ώρες/ημέρα· DEP-3+: συνεχές'
scaling_law: Κόστος ~ |Θ_lib|·k + samples·verify· η συνέπεια (CGM οικογένεια) αναμένεται να αυξάνει με |Θ_lib| (AlphaGeometry-class)· MFA-VO-083.
verification_strategy: 'MFA-VO-083: TGL-E1 (συνέπεια σε sealed ↑) F2/F3· TGL-E2 (0 Tier-0 παραβιάσεις σε 10⁵ δείγματα) F2· property: constrained decode ⇒ ⊨ H (F1)'
experiments:
- id: TGL-E1
  design: Πολιτική με/χωρίς TGL (ίδιο compute)· CGM οικογένεια «θεωρηματική συνέπεια» + νομικές οικογένειες sealed
  preregistered_criterion: Συνέπεια ↑ με διακριτικό περιθώριο ΚΑΙ καμία νομική οικογένεια BWT < −ε
- id: TGL-E2
  design: 10⁵ δείγματα υπό constrained decoding έναντι unconstrained· μετρητές παραβίασης H
  preregistered_criterion: 0 εκπεμπόμενες παραβιάσεις H· rejection rate < 20 % μετά 3 epochs
falsifiers:
- 'TGL-E1: καμία αύξηση συνέπειας ή υποχώρηση νομικών οικογενειών (η καθοδήγηση δεν προσθέτει ή βλάπτει — νέος μηχανισμός καθοδήγησης, η ικανότητα μένει)'
- Εκπεμπόμενη παραβίαση H (σφάλμα υλοποίησης)
