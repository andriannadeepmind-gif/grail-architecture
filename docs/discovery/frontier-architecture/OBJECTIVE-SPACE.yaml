    provenance_kind: explicit
    assumptions: ["Η συμπεριφορική ισοδυναμία είναι μη αποκρίσιμη — άρα η συνέχεια ελέγχεται ως σύζευξη ελέγξιμων ιδιοτήτων, όχι ως ισομορφισμός (MATERIAL-SYNTHESIS §9.19)"]
