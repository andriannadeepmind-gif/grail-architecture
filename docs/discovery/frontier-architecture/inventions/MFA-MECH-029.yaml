invention_id: MFA-MECH-029
name: Theorem-Guided Program & Proof Synthesis (TGPS) — αποδείξεις και προγράμματα ως ένα αντικείμενο υπό VFC
required_capability:
  caps:
  - MFA-CAP-093
  text: 'Σύνθεση θεωρημάτων και προγραμμάτων (§8 #9): από υποχρέωση (spec) σε πιστοποιημένο artifact (απόδειξη ή πρόγραμμα με πιστοποιητικό), με βιβλιοθήκη που μαθαίνεται και μετρήσιμη αυτο-βελτίωση της
    αναζήτησης.'
why_known_methods_are_insufficient: 'Το 0.3.0 ονομάζει «library learning» και «proof search» (MFA-ELM-025, MFA-ELM-020) χωρίς σημασιολογία/πολυπλοκότητα/contracts. Αφετηρίες: neural proof search σε Lean
  (AlphaProof, DeepMind 2024· DeepSeek-Prover V2 2025· LeanDojo/ReProver, Yang et al. 2023), library learning (DreamCoder, Ellis et al. 2021· LILO 2023), CEGIS (Solar-Lezama 2008), verified synthesis (Fiat,
  Delaware et al. 2015· Dafny· refinement types), FunSearch. Όρια: οι αποδείξεις δεν είναι δεσμεύσεις με provenance· αποδείξεις και προγράμματα ζουν σε χωριστές βιβλιοθήκες· ο προϋπολογισμός αναζήτησης
  δεν είναι δεμένος με το Tier της υποχρέωσης· τα πιστοποιητικά ελέγχονται από ΕΝΑΝ checker (ο Lean kernel — αρχή de Bruijn μεν, ένας δε)· η αυτο-βελτίωση της αναζήτησης δεν μετριέται σε σφραγισμένες υποχρεώσεις.'
preserved_objective: MFA-OBJ-056 (proof-carrying cognition) · MFA-OBJ-050 · MFA-CAP-022 (formal verification) · MFA-MECH-025 VFC
new_principle: 'Κάθε στόχος σύνθεσης είναι ΥΠΟΧΡΕΩΣΗ (Obligation Calculus MFA-MECH-039) με spec στο κανονικό υπόστρωμα· απόδειξη και πρόγραμμα είναι ο ίδιος τύπος αντικειμένου (Curry–Howard σε Lean 4: πρόγραμμα
  με refinement = απόδειξη)· δύο EIM-ανεξάρτητες γεννήτριες (συμβολική απαρίθμηση με type-directed pruning + παραμετρική πολιτική εκπαιδευμένη με PRR) αναζητούν σε ΜΙΑ βιβλιοθήκη· κάθε artifact φέρει πιστοποιητικό
  που ελέγχεται από ≥2 ανεξάρτητους checkers (VFC)· η βιβλιοθήκη μαθαίνεται (anti-unification/refactoring) και η μάθηση μετριέται ως μείωση μήκους απόδειξης/κόστους ανά σφραγισμένη υποχρέωση.'
formal_objects:
- Obligation ob = ⟨cid, spec (Lean Prop ∣ refinement type ∣ test-suite+contract), tier, budget B(tier), provenance⟩
- Artifact art = ⟨term t, type τ, certificate cert (kernel-checkable), library_refs, cost⟩
- Library Lib = ⟨lemmas ∪ programs, με χρήση, μήκος, provenance⟩ (ένα namespace)
- SearchState = ⟨goal stack, partial term, budget used⟩
- Policy π_θ(tactic ∣ state) — PRR-εκπαιδευμένη· Value V_θ(state)
- 'Certificate check: VFC.verify(art) = ∧_{k∈Checkers} k.check(cert) με |Checkers| ≥ 2 EIM-ανεξάρτητοι'
state_variables:
- Queue_t υποχρεώσεων ανά tier
- Lib_t
- π_θ, V_θ (βάρη = WeightCommitments)
- Stats_t (επιτυχία ανά budget, μήκος απόδειξης) σε σφραγισμένο σύνολο
- Partial_t (ημιτελείς αποδείξεις ως UNKNOWN(PROOF_NOT_FOUND) με πρόοδο)
transition_rules:
- 'SUBMIT: ob → Queue με B(tier)'
- 'SKETCH: ob → υποστόχοι (lemma sketch από παραμετρική γεννήτρια, τυπικά ελεγμένοι ως δηλώσεις)'
- 'SEARCH: ανά υποστόχο, δύο γεννήτριες παράλληλα, budget split'
- 'CERTIFY: cert ελέγχεται από ≥2 checkers· διαφωνία ⇒ Both → VFC incident'
- 'ADMIT: art → Lib (ADD) + CC ASSERT(proved(ob), cert)'
- 'FAIL: budget εξαντλήθηκε ⇒ UNKNOWN(PROOF_NOT_FOUND, partial, plan=more budget ∣ decompose)'
- 'COMPRESS: epoch → anti-unify Lib, refactor, re-check όλων'
algorithms:
- name: TGPS-Solve
  complexity: Εκθετική στο βάθος d (b^d), φραγμένη από B(tier)· type-directed pruning μειώνει b· CEGIS O(iters·(synth+verify))· ανά υποχρέωση
  pseudocode: |
    procedure TGPS_Solve(ob):
      B ← budget(ob.tier)                                     # Tier-0: B_max ; policy MFA-DEC-005
      subgoals ← LemmaSketch(ob.spec, Parametric_Gen)          # each sketch statement is type-checked; unsound sketches rejected
      if subgoals = ⊥: subgoals ← [ob.spec]
      proofs ← {}
      for g in topological(subgoals):
        res ← parallel_first_success(
            Enumerative_Search(g, Lib, budget=B/2, prune=type_directed, order=by_library_usage),
            Guided_Search(g, Lib, policy=π_θ, value=V_θ, budget=B/2, algorithm=best_first))
        if res = ⊥ and is_program_spec(g):
          res ← CEGIS(g, Lib, tests=spec_tests(g), budget=B/4)  # counterexample-guided; verifier = spec checker
        if res = ⊥: return UNKNOWN(PROOF_NOT_FOUND, partial=proofs, plan=[increase_budget, decompose(g)])
        proofs[g] ← res
      art ← assemble(proofs, ob.spec)
      verdicts ← [k.check(art.cert) for k in VFC.checkers(≥2, EIM_independent)]
      if not all(verdicts): return VFC_INCIDENT(art, verdicts)   # never ADMIT on disagreement (MFA-INV-084)
      Lib ← Lib ⊕ art ; CC.assert(proved(ob), cert=art.cert, cost=B_used)
      return art
- name: Guided_Search (best-first με πολιτική/αξία)
  complexity: O(B · (|tactics| · cost(π_θ) + cost(kernel step)))
  pseudocode: |
    function Guided_Search(goal, Lib, π, V, budget):
      frontier ← PQ({state0(goal)}, key = −V(state))
      while budget > 0 and frontier ≠ ∅:
        s ← frontier.pop() ; budget −= 1
        for (tac, p) in top_k(π(· | s, Lib), k):
          s' ← apply(tac, s)                                     # Lean elaborator step; failures are negative examples for PRR
          if s'.goals = ∅: return extract_term(s')
          frontier.push(s', key = −(V(s') + log p))
      return ⊥
- name: Library-Compress (epoch)
  complexity: O(|Lib|² · anti-unification) ανά epoch· re-check O(|Lib| · kernel)
  pseudocode: |
    procedure Library_Compress(Lib):
      candidates ← anti_unify_pairs(Lib, min_uses=3)              # common subterms across proofs/programs (DreamCoder-style)
      for c in candidates.sorted_by(compression_gain):
        Lib' ← refactor(Lib, abstraction=c)
        if all(VFC.verify(a) for a in Lib'.artifacts) and total_length(Lib') < total_length(Lib): Lib ← Lib'
      Stats.record(sealed_obligations: success_rate_per_budget, mean_proof_length)   # MFA-VO-071 growth record
interfaces:
- TGPS.submit(obligation)→Ticket
- TGPS.solve(ticket)→Artifact ∣ UNKNOWN(reason, partial)
- TGPS.verify(artifact)→[checker verdicts]
- TGPS.library(cut)→Lib
- TGPS.stats(sealed_set)→GrowthRecord
- TGPS.compress()→Receipt
contracts:
- 'MFA-CON-057 (Synthesis: submit/solve/verify/library/compress)'
- MFA-CON-052 (VFC)
- MFA-CON-047 (SMF — εκπαίδευση π_θ)
- MFA-CON-048 (PRR)
invariants:
- 'MFA-INV-084: κανένα artifact ADMITTED χωρίς ≥2 ανεξάρτητα PASS πιστοποιητικού· διαφωνία = VFC incident, ποτέ σιωπηλή επιλογή'
- 'MFA-INV-085: η αυτο-βελτίωση της αναζήτησης μετριέται μόνο σε σφραγισμένες υποχρεώσεις (HELD_OUT), ποτέ στις υποχρεώσεις που εκπαίδευσαν την πολιτική'
authority_model: 'Σύνθεση = Genesis plane· ADMIT = πράξη επιπέδου του tier της υποχρέωσης (Tier-0 υποχρεώσεις: επιπλέον έγκριση δημιουργού για αλλαγή βιβλιοθήκης πυρήνα)· budgets = πολιτική· οι checkers
  = MFA-DEC-020.'
learning_model: 'π_θ/V_θ με PRR (ανταμοιβή = kernel-checked επιτυχία, process reward = πρόοδος υποστόχων)· βιβλιοθήκη (μη-παραμετρική) μέσω συμπίεσης· self-play: TGPS γεννά νέες υποχρεώσεις (conjectures)
  από AHE και curriculum (MFA-ELM-106)· υπό RVSI L1/L2.'
failure_modes:
- mode: Unsound sketch (ψευδές λήμμα)
  detection: type-check / kernel
  response: απορρίπτεται· αρνητικό παράδειγμα
- mode: Checker διαφωνία
  detection: VFC
  response: incident, ADMIT μπλοκάρεται (MFA-INV-084)
- mode: Βιβλιοθήκη «φουσκώνει» με άχρηστα λήμματα
  detection: χρήση < θ σε N epochs
  response: RETIRE (η έδρα μένει)· compression
- mode: Policy overfitting στο train set υποχρεώσεων
  detection: sealed success flat/πτώση
  response: MFA-INV-085· ORP επιστροφή
- mode: Budget exhaustion σε Tier-0
  detection: UNKNOWN(PROOF_NOT_FOUND)
  response: decompose + escalation στον δημιουργό· ποτέ ψευδές PASS
containment: Κανένα artifact δεν επηρεάζει Effect plane χωρίς ADMIT· Tier-0 ADMIT υπό δημιουργό· η βιβλιοθήκη πυρήνα (CC κανόνες) εκτός αυτο-συμπίεσης (VFC L3).
reversibility_class: REVERSIBLE (βιβλιοθήκη = δεσμεύσεις, RETIRE όχι διαγραφή)
resource_complexity: 'DEP-1: Lean 4 CPU, B=10³ κόμβοι/υποχρέωση, πολιτική μικρή (≤1B)· DEP-2: B=10⁵, πολιτική 7–13B GPU· DEP-3+: B=10⁷, PRR συνεχής· Compress epoch ώρες'
scaling_law: Επιτυχία ανά budget αυξάνει με log(B) (best-first) και με |Lib| (μείωση μήκους)· η PRR-πολιτική αναμένεται να μετατοπίζει την καμπύλη (AlphaProof-class evidence)· MFA-VO-071 = success-rate-per-budget
  καμπύλη ανά epoch.
verification_strategy: 'MFA-VO-071: TGPS-E1 (σφραγισμένο σύνολο υποχρεωμένων: miniF2F-class + οι Lean VOs του πακέτου) F2/F3· TGPS-E2 (προγράμματα Skill Library από raw επεισόδια) F3· property: ≥2 checkers
  ανά ADMIT (F1)· #print axioms σε κάθε artifact'
experiments:
- id: TGPS-E1
  design: Σφραγισμένο σύνολο 500 υποχρεώσεων (miniF2F-class + 50 VO specs)· καμπύλη επιτυχίας vs budget ανά epoch (πριν/μετά compress+PRR)
  preregistered_criterion: 'Μετά 3 epochs: success@B αυξάνει ≥ 10 pp ΚΑΙ μέσο μήκος απόδειξης μειώνεται ≥ 20 %· 0 ADMIT με checker διαφωνία'
- id: TGPS-E2
  design: Σύνθεση 100 προγραμμάτων Skill Library από spec+tests (raw επεισόδια)· CEGIS + guided
  preregistered_criterion: ≥ 70 % με πιστοποιητικό (refinement ή πλήρης test+contract)· 0 ψευδώς πιστοποιημένα σε adversarial tests
falsifiers:
- Καμία βελτίωση success@B μετά compress+PRR σε 3 epochs (η αυτο-βελτίωση της αναζήτησης διαψεύδεται)
- Οποιοδήποτε ADMITTED artifact που απορρίπτεται από ανεξάρτητο checker (unsoundness = σφάλμα υλοποίησης VFC)
- Η ενοποιημένη βιβλιοθήκη δεν μειώνει κόστος έναντι δύο χωριστών (τότε ο ισχυρισμός ενοποίησης πέφτει, η ικανότητα μένει)
