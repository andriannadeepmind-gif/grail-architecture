    alternatives: ["Ταυτότητα = ίδια βάρη μοντέλου — απορρίπτεται: δένει την οντότητα με έναν πάροχο (KT-01)"]
    conflicts: [MFA-CFL-003, MFA-CFL-011]
    unknowns: [MFA-UNK-004]
    verification: "KT-01, KT-08, KT-02· ContinuityMeasured· ετυμηγορία από ΕΞΩΤΕΡΙΚΟ εκδότη (δημιουργός + ανεξάρτητος verifier)"
    falsifier: "Battery d > ε μετά από μετάβαση που το σύστημα δήλωσε «συνεχής»"
    evolution_path: "Το τέταρτο σκέλος (υπολογιστική συνέχεια) μπαίνει ως επέκταση του INV-I01 — βλ. INVARIANTS.yaml"
