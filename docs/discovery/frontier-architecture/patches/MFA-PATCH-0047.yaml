    - 'ATK-22: ECE-E3 — οικογένεια όπου ο λύτης > κάθε μοντέλο-κριτής· η H-symbolic+human συνιστώσα διατηρεί proper score > chance· staleness drill (H παλαιότερη
      κατά 2 εποχές) με δηλωμένη απώλεια'
