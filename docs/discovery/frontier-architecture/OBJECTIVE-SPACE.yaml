    statement: "Μία οντότητα παραμένει η ίδια (κρυπτογραφικά, μνημονικά, χαρακτηρολογικά και — νέο τέταρτο σκέλος — υπολογιστικά) μέσα από αλλαγές παρόχου, γλώσσας, runtime, σώματος και metamodel."
    purpose: "Χωρίς συνέχεια δεν υπάρχει ούτε ευθύνη ούτε συσσώρευση κρίσης."
