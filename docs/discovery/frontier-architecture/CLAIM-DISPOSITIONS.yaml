- claim_id: H2
  source_verdict: HOLDS
  source_line: 115
  claim_text: '**METROPOLIS** — Κάθε αντικείμενο που διασχίζει όριο **φέρει** το αποδεικτικό του, με σχήμα δέκα πεδίων.'
  source_basis_or_failure: 'Ο Α΄ γύρος το απέρριψε διαβάζοντας «αποδεικτικό» ως *proof* (μαθηματική απόδειξη) και απαιτώντας κάτι που το κείμενο
    δεν υπόσχεται. Στα ελληνικά και στη νομική γλώσσα «αποδεικτικό» είναι **απόδειξη παραλαβής/προέλευσης** — receipt, attestation. Το ρήμα «φέρει»
    επιβεβαιώνει: το αντικείμενο μεταφέρει, δεν αποδεικνύει. Με αυτή την ανάγνωση ο ισχυρισμός είναι όχι μόνο συνεπής αλλά υλοποιήσιμος σήμερα.'
  preserved_residue_or_action: 'Η γρ. 874 του εγγράφου δίνει ρητά τη βάση για υπογραφή και ανάκληση, με κανόνα μη-κυκλικότητας. Εξωτερική επιβεβαίωση:
    in-toto attestation envelope (ανοίχτηκε απευθείας), SLSA provenance, Sigstore.'
