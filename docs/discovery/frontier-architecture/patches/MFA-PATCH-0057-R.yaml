        ### MFA-ELM-111 — Abductive Hypothesis Engine (AHE) [S2/both] · ωριμότητα X · δόση 1 · επιστημική κατάσταση NOVEL SYNTHESIS


        - **Δήλωση:** Υπόθεση = τυπωμένη δέσμευση H = ⟨explanandum, μοντέλο/πρόγραμμα, falsifier, νέες προβλέψεις, κόστος ελέγχου⟩· χωρίς falsifier δεν εισάγεται
        (η απόρριψη καταγράφεται). Τρεις EIM-ανεξάρτητες γεννήτριες (ILP πάνω στην οντολογία, αναζήτηση προγραμμάτων στο Skill Library, παραμετρική πρόταση από κυρίαρχο
        μοντέλο) ανταγωνίζονται· κατάταξη με Expected Falsification Value EFV(H) = P(διάψευση)·InfoGain / cost· έλεγχος Genesis-first (LWM/World Twin/DST) και μετά
        υπό RET· επιζώσες υποθέσεις προάγονται μηχανικά σε OGE (έννοιες) ή CDCE (ακμές)· επαναλαμβανόμενα εξηγητικά σχήματα συμπιέζονται (anti-unification) σε βιβλιοθήκη.
        · ATK-19: υπόθεση χωρίς εφικτό venue ελέγχου = DEFERRED(NOT_YET_OBSERVABLE, plan) εκτός κατάταξης EFV· ο έλεγχος ποτέ στη γεννήτρια που παρήγαγε το explanandum
        (κυκλικότητα)· venue-feasibility είναι μέρος του τύπου Hypothesis.

        - **Σκοπός:** Εφεύρεση υποθέσεων (§8 #8): από ανωμαλία σε σύνολο ανταγωνιστικών, διαψεύσιμων υποθέσεων με σχεδιασμένο πείραμα, χωρίς ανθρώπινη πρόταση.

        - **Ικανότητες:** MFA-CAP-092 · **Προέλευση:** MFA-MECH-028, Ω-MAXIMUM NON-ABSTENTION MANDATE 0.4.0 (creator-authorized) §6/§7/§8, ILP/Popper (Cropper & Morel
        2021), abductive LP (Kakas et al. 1992)

        - **Υποθέσεις:** τρεις γεννήτριες EIM-ανεξάρτητες διαθέσιμες

        - **Εξαρτήσεις:** MFA-ELM-025, MFA-ELM-028, MFA-ELM-030, MFA-ELM-050, MFA-ELM-091, MFA-ELM-100, MFA-ELM-106, MFA-ELM-109, MFA-ELM-110, MFA-ELM-112 · **Διεπαφές:**
        MFA-CON-056

        - **Εξουσία:** Γένεση/κατάταξη = Genesis plane· έλεγχοι στο Effect plane μόνο υπό RET + envelope· PROMOTE = Proceeding-lite όταν αγγίζει Tier-0/1 έννοιες·
        ο δημιουργός βλέπει κάθε υπόθεση στο cockpit (MFA-ELM-091).

        - **Κατάσταση:** Μεταβλητές: A_t ουρά ανωμαλιών· S_t σύνολα υποθέσεων ανά ανωμαλία με posterior· Lib_t βιβλιοθήκη σχημάτων· Tests_t (προγραμματισμένα/εκτελεσμένα)·
        GenStats_t (calibration ανά γεννήτρια — proper scoring από HELD_OUT) ‖ ANOMALY: residual > θ ή Void entry ⇒ a ∈ A_t· GENERATE: S_a ← ∪_g Gen_g(a, Lib) με
        g EIM-ανεξάρτητες· type-check φ (χωρίς falsifier ⇒ REJECTED_UNFALSIFIABLE, καταγράφεται)· RANK: EFV· schedule top-k υπό budget· TEST: venue Genesis-first·
        Effect μόνο RET REVERSIBLE/envelope· UPDATE:…

        - **Αποτυχίες:** mode: Ad hoc υποθέσεις (εξηγούν μόνο το explanandum), response: REJECTED_AD_HOC (MFA-INV-082)· mode: Γεννήτρια που κυριαρχεί (mode collapse),
        response: quota ανά γεννήτρια· EIM έλεγχος· mode: P-hacking μέσω πολλών ελέγχων, response: προκαταχωρισμένο κριτήριο + BH διόρθωση· mode: Επικίνδυνο πείραμα,
        response: μόνο Genesis venues ή δημιουργός· mode: Αντιπαλική ανωμαλία (σπρώχνει προς επιθυμητή υπόθεση), response: CAM-NS ως αντίπαλος στο S· quarantine

        - **Εναλλακτικές:** ανθρώπινες υποθέσεις (0.3.0), μία γεννήτρια LLM · **Συγκρούσεις:** — · **Άγνωστα:** MFA-UNK-117

        - **Επαλήθευση:** MFA-VO-070 · **Falsifier:** AHE-E1: ανάκτηση όχι καλύτερη από τυχαίες υποθέσεις

