# 0.4.0 — F1 finding (tools/twin/oc.py, MFA-PATCH-0058): the Act rule is STRICTER than the pseudocode above — only Verified[τ], or Claimed[τ] with a
# RET-approved DEFER for a reversible/compensable effect class, may reach the Effect plane; Unknown[reason]/Base values are UNVERIFIED_EFFECT (MFA-INV-105).
# The literal condition let one flawed OC-E1 flow through; the strict form is the binding one. Measured at F1: 25/25 accepted, 25/25 rejected with reason.
