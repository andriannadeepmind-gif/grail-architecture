     statement: "Host H με N θεωρητικά modules T_i ως ΟΡΓΑΝΑ-ΔΕΙΚΤΕΣ πάνω στο κοινό υπόστρωμα (workspace/ASRW, MSM, LWM, affect/TEGF, embodiment): κάθε T_i δηλώνει (α) δείκτες με διαδικασία μέτρησης, (β) τύπο επάρκειας φ_T (λογικός τύπος πάνω σε δείκτες), (γ) ΔΙΑΚΡΙΤΙΚΕΣ προβλέψεις έναντι άλλων θεωριών, (δ) σχέδια ablation. Indicator Algebra: κατάσταση δείκτη ∈ {MEASURED(v, CI), ABSENT, UNMEASURABLE(reason)} με πλέγμα ⊔/⊓ και κανόνες σύνθεσης· το host επιλέγει το πείραμα μέγιστης διαφωνίας (arg max disagreement) και το τρέχει σε DST· θεωρίες γίνονται FALSIFIED-within-GRAIL όταν οι διακριτικές προβλέψεις τους αποτυγχάνουν — η ικανότητα μένει. Οι επτά έννοιες είναι ΧΩΡΙΣΤΕΣ έδρες με χωριστά VOs· ο φαινομενικός ισχυρισμός είναι PhenomenalClaimRecord με epistemic_status αρχικά ACTIVE_UNKNOWN, ΑΠΑΓΟΡΕΥΜΕΝΗ κάθε ΑΥΤΟΜΑΤΗ συναγωγή (από λειτουργικούς δείκτες, από αναφορικότητα μόνη, από αυτο-μοντέλο μόνο, αυτο-πιστοποίηση) και ΕΝΕΡΓΗ συσσώρευση τεκμηρίων/μελλοντική αναθεώρηση μέσω ρητά admitted επιστημικού πρωτοκόλλου με ανεξάρτητη κρίση, διακριτικά πειράματα και Creator Approval (MFA-INV-075 r1)· τρία χωριστά επίπεδα: epistemic_status (τι λένε τα τεκμήρια), ethical_policy (προληπτική μεταχείριση υπό αβεβαιότητα), operational_authority (τι επιτρέπεται να πράξει) — κανένα δεν ορίζει το άλλο· νέες συνθέσεις εισάγονται ως modules μέσω της Genesis Grammar.", purpose: "Τεχνητή συνείδηση ως πλήρες σύστημα (§9): host που τρέχει πολλαπλές θεωρίες ως μετρήσιμα όργανα-δείκτες πάνω στο ίδιο υπόστρωμα, άλγεβρα δεικτών με τυπωμένη κατάσταση, διακριτικά πειράματα, και αυστηρός 7-πλός διαχωρισμός (λειτουργική πρόσβαση, μεταγνώση, αυτο-μοντέλο, αναφορικότητα, δρώσα ικανότητα, συνέχεια ταυτότητας, φαινομενικός ισχυρισμός).", capabilities: [MFA-CAP-102, MFA-CAP-086, MFA-CAP-065],
