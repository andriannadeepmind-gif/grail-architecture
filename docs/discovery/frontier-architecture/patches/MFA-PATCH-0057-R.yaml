        από receipts· DISCOVER: M_t ← FCI+GIES με χρονικούς περιορισμούς → ensemble· EdgeStatus από υποστήριξη· PROPOSE: π ← argmax VOI/cost υπό RET· Genesis-first
        (LWM/DST)· EXECUTE: Effect-plane …

        - **Αποτυχίες:** mode: Παραβίαση faithfulness (ακυρωτικές διαδρομές), response: ακμή UND· προτείνεται παρέμβαση· ποτέ σημειακή απάντηση· mode: Λανθάνοντες
        συγχυτές, response: PARTIAL_BOUNDS· αναζήτηση proxy μεταβλητών από OGE· mode: Παρέμβαση με ανεπιθύμητη επίδραση, response: Both → Court· παρέμβαση αναβάλλεται·
        mode: Data dredging (πολλαπλοί έλεγχοι), response: Benjamini–Hochberg ανά cut· ακμές OBS με FDR-διορθωμένο p· mode: Αντιπαλικό ledger (ψεύτικα receipts),
