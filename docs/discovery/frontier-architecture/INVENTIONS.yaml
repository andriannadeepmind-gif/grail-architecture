  - {<<: *d, id: MFA-MECH-039, name: "Obligation Calculus (OC) — τύποι υποχρέωσης για κάθε γνωσιακό βήμα (proof-carrying cognition)", maturity: X, dossier: mechanisms/MFA-MECH-039.md,
