  - {<<: *d, id: MFA-MECH-030, name: "Recursive Architecture Generator (RAGen) — αναζήτηση αρχιτεκτονικών ως τυπωμένων γονιδιωμάτων υπό πύλη επαλήθευσης", maturity: X, dossier: mechanisms/MFA-MECH-030.md,
     statement: "Η αρχιτεκτονική είναι τυπωμένο γονιδίωμα G στη Genesis Grammar (MFA-MECH-032): στοιχεία με contracts, invariants, συνδεσμολογία, παραμέτρους ΚΑΙ τελεστές αναζήτησης. Το RAGen κάνει Quality-Diversity αναζήτηση (MAP-Elites με περιγραφητές = συντεταγμένες του capability lattice + κόστος + κλάση απόδειξης), κάθε υποψήφιο instantiated ως σκιώδης αρχιτεκτονική στο δίδυμο (TES, MFA-MECH-043) σε πιστότητα F1/F2, αξιολογείται σε ΣΦΡΑΓΙΣΜΕΝΕΣ υποχρεώσεις (KT/VO) από HELD_OUT, μπαίνει σε Pareto αρχείο, και προάγεται ΜΟΝΟ μέσω RVSI L2 → GCP shadow→canary→cutover. Αναδρομή: οι τελεστές μετάλλαξης είναι γονιδιώματα επιπέδου L2 με fitness = ρυθμός βελτίωσης απογόνων· το harness αξιολόγησης, το VFC και το Telos είναι L3 (σταθερό σημείο) — ποτέ στον χώρο.", purpose: "Αναζήτηση αρχιτεκτονικής και αναδρομική γένεση αρχιτεκτονικής (§8 #10, §6 #5/#7): το σύστημα προτείνει, ελέγχει και προάγει παραλλαγές της ίδιας της αρχιτεκτονικής του (στοιχεία, συνδεσμολογία, μηχανισμοί, παράμετροι) — και των ίδιων των τελεστών αναζήτησης — χωρίς να αγγίζει το σταθερό σημείο.", capabilities: [MFA-CAP-094],
     source_provenance: ["MAP-Elites (Mouret & Clune 2015)", "ADAS (Hu et al. 2024)", "Darwin Gödel Machine (Zhang et al. 2025)", AA-014, "Ω-MAXIMUM NON-ABSTENTION MANDATE 0.4.0 (creator-authorized) §6/§7/§8", "inventions/MFA-MECH-030.yaml (29 πεδία)"], contribution: "NEW ARCHITECTURAL INVENTION", assumptions: ["σφραγισμένες KT/VO οικογένειες με διακριτική ισχύ"],
