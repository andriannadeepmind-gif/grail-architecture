        ## 0.4.0 — Ευρήματα της F1 εκτελέσιμης προδιαγραφής (tools/twin/oc.py, MFA-PATCH-0058)


        1. **Act αυστηρότερο από το pseudocode:** ο κανόνας `Act(e1)` δέχεται μόνο `Verified[τ]` ή `Claimed[τ]` με DEFER εγκεκριμένο από RET για ΑΝΑΣΤΡΕΨΙΜΗ/αντισταθμίσιμη
        κλάση επίδρασης· τιμή τύπου `Unknown[reason]` ή `Base` που φτάνει στο Effect plane είναι `UNVERIFIED_EFFECT`. Η κυριολεκτική συνθήκη του πεδίου `algorithms[0]`
        άφηνε μία λανθασμένη ροή (OC-E1) να περάσει· η αυστηρή μορφή είναι η ισχύουσα (MFA-INV-105).

        2. **Κοκκομετρία:** μία υποχρέωση ανά δέσμευση/κλάση επίδρασης (MFA-PATCH-0050, ATK-25) — επιβεβαιώνεται στο OC-E1 (≈10 υποχρεώσεις ανά ροή).

        3. **Πιστοποιητικά:** ο stub VFC με δύο ανεξάρτητους checkers και τον κανόνα γενεαλογίας (MFA-INV-089) απορρίπτει cert από checker ίδιας γενεαλογίας με τη
        γεννήτρια.

        4. **Μετρήσεις F1:** 25/25 σωστές ροές δεκτές, 25/25 λανθασμένες απορριφθείσες με λόγο (DROPPED_OBLIGATIONS, INSUFFICIENT_EVIDENCE, INVALID_DEFER, NO_SUCH_OBLIGATION,
