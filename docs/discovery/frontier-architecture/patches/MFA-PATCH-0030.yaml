  MFA-ELM-112:
    _add: true
    name: Theorem-Guided Program & Proof Synthesis (TGPS)
    stratum: S3
    plane: both
    corresponds_to: []
    delta: NEW
    maturity: X
    statement: 'Κάθε στόχος σύνθεσης είναι ΥΠΟΧΡΕΩΣΗ (Obligation Calculus MFA-MECH-039) με spec στο κανονικό υπόστρωμα· απόδειξη και πρόγραμμα είναι ο ίδιος τύπος
      αντικειμένου (Curry–Howard σε Lean 4: πρόγραμμα με refinement = απόδειξη)· δύο EIM-ανεξάρτητες γεννήτριες (συμβολική απαρίθμηση με type-directed pruning + παραμετρική
      πολιτική εκπαιδευμένη με PRR) αναζητούν σε ΜΙΑ βιβλιοθήκη· κάθε artifact φέρει πιστοποιητικό που ελέγχεται από ≥2 ανεξάρτητους checkers (VFC)· η βιβλιοθήκη
      μαθαίνεται (anti-unification/refactoring) και η μάθηση μετριέται ως μείωση μήκους απόδειξης/κόστους ανά σφραγισμένη υποχρέωση.'
    purpose: 'Σύνθεση θεωρημάτων και προγραμμάτων (§8 #9): από υποχρέωση (spec) σε πιστοποιημένο artifact (απόδειξη ή πρόγραμμα με πιστοποιητικό), με βιβλιοθήκη που
      μαθαίνεται και μετρήσιμη αυτο-βελτίωση της αναζήτησης.'
    capabilities:
    - MFA-CAP-093
    source_provenance:
    - MFA-MECH-029
    - Ω-MAXIMUM NON-ABSTENTION MANDATE 0.4.0 (creator-authorized) §6/§7/§8
    - AlphaProof 2024· DeepSeek-Prover 2025· LeanDojo 2023
    - DreamCoder/LILO
    assumptions:
    - ≥2 EIM-ανεξάρτητοι checkers (VFC)
    dependencies:
    - MFA-ELM-020
    - MFA-ELM-025
    - MFA-ELM-086
    - MFA-ELM-099
    - MFA-ELM-100
    - MFA-ELM-103
    - MFA-ELM-104
    - MFA-ELM-106
    - MFA-ELM-113
    - MFA-ELM-122
    interfaces:
    - MFA-CON-057
    authority: 'Σύνθεση = Genesis plane· ADMIT = πράξη επιπέδου του tier της υποχρέωσης (Tier-0 υποχρεώσεις: επιπλέον έγκριση δημιουργού για αλλαγή βιβλιοθήκης πυρήνα)·
      budgets = πολιτική· οι checkers = MFA-DEC-020.'
    state_model: 'Μεταβλητές: Queue_t υποχρεώσεων ανά tier· Lib_t· π_θ, V_θ (βάρη = WeightCommitments)· Stats_t (επιτυχία ανά budget, μήκος απόδειξης) σε σφραγισμένο
      σύνολο· Partial_t (ημιτελείς αποδείξεις ως UNKNOWN(PROOF_NOT_FOUND) με πρόοδο) ‖ SUBMIT: ob → Queue με B(tier)· SKETCH: ob → υποστόχοι (lemma sketch από παραμετρική
      γεννήτρια, τυπικά ελεγμένοι ως δηλώσεις)· SEARCH: ανά υποστόχο, δύο γεννήτριες παράλληλα, budget split· CERTIFY: cert ελέγχεται από ≥2 checkers· διαφωνία ⇒
      Both → VFC incident· ADMIT: art → Lib (ADD) + CC ASSERT(proved(ob), cert) …'
    failure_modes:
    - mode: Unsound sketch (ψευδές λήμμα)
      response: απορρίπτεται· αρνητικό παράδειγμα
    - mode: Checker διαφωνία
      response: incident, ADMIT μπλοκάρεται (MFA-INV-084)
    - mode: Βιβλιοθήκη «φουσκώνει» με άχρηστα λήμματα
      response: RETIRE (η έδρα μένει)· compression
    - mode: Policy overfitting στο train set υποχρεώσεων
      response: MFA-INV-085· ORP επιστροφή
    - mode: Budget exhaustion σε Tier-0
      response: decompose + escalation στον δημιουργό· ποτέ ψευδές PASS
