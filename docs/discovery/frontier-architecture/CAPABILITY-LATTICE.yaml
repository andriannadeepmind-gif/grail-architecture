# CAPABILITY-LATTICE — οι ικανότητες που απαιτούν οι επιδιώξεις, ως μερικά διατεταγμένο σύνολο (εντολή §4.4, §10, §24).
# epistemic_status (Ω-ASI 0.4.0 §5, MFA-PATCH-0036): κατάσταση ισχυρισμού ανά ικανότητα, χωριστή από την ωριμότητα και από το αν η ικανότητα μένει στον στόχο· για 001…088 μηχανικά από maturity (T→IMPLEMENTABLE FROM KNOWN COMPONENTS, X→NOVEL SYNTHESIS, R/E→RESEARCH HYPOTHESIS), για 089…108 από το δοσιέ.
# Copyright (c) 2026 STAVROPOULOS LAW. All Rights Reserved.
#
# Κανόνες:
#  - Μία ικανότητα = τι ΜΠΟΡΕΙ το σύστημα, μετρήσιμα· όχι όργανο, όχι τεχνολογία. Τα όργανα που την παρέχουν ζουν στο
#    ARCHITECTURE-ELEMENTS.yaml και η σχέση provides στο RELATIONS.yaml (μία έδρα ανά σχέση).
#  - refines: η ικανότητα είναι εξειδίκευση της γονικής (⊑)· requires: δεν μπορεί να υπάρξει χωρίς την άλλη.
#  - Το lattice είναι ΜΟΝΟΤΟΝΟ: μια ικανότητα με evidence σε release n πρέπει να έχει evidence σε n+1 (INV-C01)·
#    η τύχη κάθε ικανότητας του corpus καταγράφεται στο CAPABILITY-CONSERVATION.md.
#  - maturity: T = τεκμηριωμένο σήμερα (υπάρχει έδρα ή δημόσιο σύστημα) · X = απαιτεί πείραμα · E = σημείο επέκτασης
#    με συμβόλαιο · R = ερευνητικό μέτωπο με Mechanism Dossier (INVENTIONS.yaml).
#  - concern: μία από τις 37 της εντολής §10 (κάλυψη ελέγχεται στο τέλος του αρχείου).

