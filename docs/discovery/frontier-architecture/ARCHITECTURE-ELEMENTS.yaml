    phases:
      - {phase_id: curate, provider: MFA-ELM-082, input_type: DataBatch, precondition: "licence/provenance/taint known", contract: MFA-CON-018, obligations: ["data lineage", "deletion duties"], budget: data, timeout: declared, effect_class: NONE, output_type: TrainingManifest, evidence: DataReceipt, failure_transition: quarantine}
      - {phase_id: train, provider: MFA-ELM-100, input_type: TrainingManifest, precondition: "Genesis resources leased", contract: MFA-CON-047, obligations: ["weight lineage", "losses", "resource record"], budget: training, timeout: declared, effect_class: NONE, output_type: CandidateWeights, evidence: TrainingReceipt, failure_transition: discard_candidate}
      - {phase_id: verify_compare, provider: MFA-ELM-086, input_type: CandidateWeights, precondition: "held-out independent", contract: MFA-CON-027, obligations: ["all capability families", "CI", "loss map", "contamination"], budget: evaluation, timeout: declared, effect_class: NONE, output_type: EvaluationEvidence, evidence: EvaluationReceipt, failure_transition: reject_or_research}
      - {phase_id: promote, provider: MFA-ELM-038, input_type: EvaluationEvidence, precondition: "ORP/CPCL/VFC gates", contract: MFA-CON-016, obligations: ["rollback", "continuity", "serving lineage"], budget: deployment, timeout: declared, effect_class: CANARY, output_type: AdmittedOrRejectedModel, evidence: PromotionReceipt, failure_transition: rollback}
    control_flow:
      graph: "curate → train(candidate family) → verify_compare → [reject/defer | promote canary → admit/rollback]"
      data_dependencies: ["TrainingManifest→CandidateWeights→EvaluationEvidence is type-continuous", "promote reads the incumbent/rollback binding from the immutable model cut"]
      forks: ["independent candidate recipes and evaluator families may run in bounded parallel sandboxes"]
      joins: ["verify_compare joins all protected capability families, contamination, CI and deletion/unlearning obligations"]
      loops: ["retraining is a new candidate lineage with finite experiment budget; failed candidate never mutates incumbent"]
      cancellation: "cancelled training seals partial checkpoints/evidence and releases leases; canary cancellation invokes rollback"
      progress_or_variant: "finite recipes × training steps × evaluator battery; expiration yields DEFERRED_RESOURCES or REJECTED"
    input_cut: "data + current weights + evaluation + policy cuts"
    authority_path: "Genesis training → independent evidence → promotion proceeding → canary"
    obligation_path: "data/weight/capability/unlearning obligations survive promotion"
    resource_envelope: "MFA-ELM-108 acquisition + MFA-ELM-013 lease"
    success_predicate: "admitted model with lineage, no hidden protected-floor loss and live rollback"
    terminal_states: [ADMITTED_CANARY, REJECTED, DEFERRED, ROLLED_BACK]
    failure_paths: [tainted_data, training_failure, evaluation_overlap, regression, canary_failure]
    compensation_or_degraded_mode: "retain incumbent; archive candidate/evidence; satisfy deletion/unlearning obligations"
    evidence_receipts: [MFA-CON-047, MFA-CON-078, MFA-CON-079]
    fidelity_requirements: "F2 learning/evaluation; F3 canary shadow; F4 admission after evidence"
    unknowns: [MFA-UNK-122, MFA-UNK-129, MFA-UNK-137]
  - thread_id: MT-05
