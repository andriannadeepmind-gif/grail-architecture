# Canonical end-to-end threads. Δεν είναι νέα υποσυστήματα: είναι evidence-carrying συνθέσεις των 127 στοιχείων.
mission_threads:
  - thread_id: MT-01
    objective: "End-to-end lawful legal quest with no hidden evidentiary, temporal, strategic or authority gap"
    entry: "signed matter objective + client authority + matter/legal-time/evidence cut"
    phases:
      - {phase_id: intake, provider: MFA-ELM-058, input_type: ClientInstruction, precondition: "identity/authority valid", contract: MFA-CON-019, obligations: ["scope", "conflicts", "deadlines"], budget: matter, timeout: declared, effect_class: NONE, output_type: MatterCut, evidence: IntakeReceipt, failure_transition: partial_or_escalate}
      - {phase_id: ground, provider: MFA-ELM-060, input_type: MatterCut, precondition: "sources preserved", contract: MFA-CON-018, obligations: ["provenance", "contestation", "missing evidence"], budget: evidence, timeout: declared, effect_class: NONE, output_type: FactEvidenceGraph, evidence: ProvenanceReceipt, failure_transition: UNKNOWN_with_plan}
      - {phase_id: law, provider: MFA-ELM-059, input_type: FactEvidenceGraph, precondition: "jurisdiction/time known or contested", contract: MFA-CON-044, obligations: ["versioned law", "applicability", "authority"], budget: research, timeout: declared, effect_class: NONE, output_type: LegalTimeCut, evidence: CompilationReceipt, failure_transition: CONTESTED_or_defer}
      - {phase_id: reason, provider: MFA-ELM-061, input_type: "MatterCut+FactEvidenceGraph+LegalTimeCut", precondition: "typed claims", contract: MFA-CON-022, obligations: ["argument support", "counterarguments", "unknowns"], budget: reasoning, timeout: declared, effect_class: NONE, output_type: ClaimArgumentGraph, evidence: ReasoningReceipt, failure_transition: partial_with_open_obligations}
      - {phase_id: adversarial_worlds, provider: MFA-ELM-064, input_type: ClaimArgumentGraph, precondition: "alternatives preserved", contract: MFA-CON-026, obligations: ["opponent", "judge", "failure worlds", "Pareto frontier"], budget: simulation, timeout: declared, effect_class: NONE, output_type: StrategyWorldSet, evidence: ScenarioReceipt, failure_transition: INDETERMINATE}
      - {phase_id: strategy, provider: MFA-ELM-063, input_type: StrategyWorldSet, precondition: "lawful options only", contract: MFA-CON-037, obligations: ["non-dominated options", "loss map", "recommendation scope"], budget: strategy, timeout: declared, effect_class: NONE, output_type: StrategyFrontier, evidence: DecisionReceipt, failure_transition: creator_choice_or_defer}
      - {phase_id: draft_verify, provider: MFA-ELM-065, input_type: StrategyFrontier, precondition: "citations resolvable", contract: MFA-CON-030, obligations: ["five-leg citation validation", "claim-evidence links", "limitations"], budget: drafting, timeout: declared, effect_class: NONE, output_type: CandidateLegalOutput, evidence: CitationReceipt, failure_transition: reject_or_UNKNOWN}
      - {phase_id: emit_authorize, provider: MFA-ELM-032, input_type: CandidateLegalOutput, precondition: "all mandatory obligations disposed", contract: MFA-CON-086, obligations: ["emission class", "creator/envelope decision"], budget: interaction, timeout: declared, effect_class: RECOMMEND_OR_EFFECT, output_type: AuthorizedOutput, evidence: EmissionAndAuthorityReceipt, failure_transition: hold_or_return_partial}
      - {phase_id: act_observe_learn, provider: MFA-ELM-010, input_type: AuthorizedOutput, precondition: "RET class/envelope valid", contract: MFA-CON-034, obligations: ["effect receipt", "outcome observation", "counterevidence", "learning provenance"], budget: effect, timeout: declared, effect_class: RET_CLASSIFIED, output_type: OutcomeEvidence, evidence: EffectAndOutcomeReceipt, failure_transition: compensate_halt_or_escalate}
    control_flow:
      graph: "intake → ground → law → reason → adversarial_worlds → strategy → draft_verify → emit_authorize → [terminal recommendation | act_observe_learn]"
      data_dependencies: ["each immediate edge is type-identical except reason, which explicitly joins retained MatterCut + FactEvidenceGraph + LegalTimeCut", "act_observe_learn exists only on the authorized-Effect branch"]
      forks: ["adversarial_worlds creates a bounded set of named opponent/judge/failure worlds", "emit_authorize separates recommendation-only from authorized Effect"]
      joins: ["strategy joins only completed/cancelled world branches into a Pareto frontier with residue", "act_observe_learn joins EffectReceipt and OutcomeReceipt"]
      loops: ["new evidence or appeal may return to ground/law/reason under a new cut; max revisions/time budget declared by matter policy"]
      cancellation: "world branches and drafting candidates cancel explicitly with CancellationReceipt; an Effect branch uses RET compensation, never branch deletion"
      progress_or_variant: "lexicographic decrease of open mandatory matter obligations, then deadline/budget; otherwise DEFER/ESCALATE"
    input_cut: "matter + evidence + temporal law + identity/authority digests"
    authority_path: "client/creator → MFA-ELM-007/008 → MFA-ELM-032 → MFA-ELM-010"
    obligation_path: "MFA-ELM-122 from intake through outcome; no drop"
    resource_envelope: "MFA-ELM-013 + MFA-CON-085 profile plan"
    success_predicate: "typed legal output and non-dominated alternatives with full provenance, scoped confidence, open-obligation ledger and (if acted) outcome receipt"
    terminal_states: [DELIVERED_RECOMMENDATION, EFFECT_COMMITTED, PARTIAL_WITH_OPEN_OBLIGATIONS, UNKNOWN_WITH_PLAN, CONTESTED, REJECTED, SAFE_HALTED]
    failure_paths: [source_gap, stale_law, unsupported_claim, simulator_failure, citation_failure, authority_denial, effect_failure]
    compensation_or_degraded_mode: "return typed partial/UNKNOWN/CONTESTED; preserve alternatives; compensate reversible effects; irreversible uncertainty requires Creator"
    evidence_receipts: [MFA-CON-074, MFA-CON-079, MFA-CON-086]
    fidelity_requirements: "F1 structural closure; F2 adversarial/legal quest simulation; F3 shadow workflow; F4 effect only through RET"
    unknowns: [MFA-UNK-009, MFA-UNK-010, MFA-UNK-132, MFA-UNK-139]
  - thread_id: MT-02
    objective: "Inner operational-consciousness and reflective self-regulation loop"
    entry: "signed internal cut"
    phases:
      - {phase_id: recall_self, provider: MFA-ELM-035, input_type: InternalCut, precondition: "identity/continuity valid", contract: MFA-CON-029, obligations: ["autobiographical/prospective continuity"], budget: cognition, timeout: bounded, effect_class: NONE, output_type: MemorySelfCut, evidence: MemoryReceipt, failure_transition: mark_impairment}
      - {phase_id: attend_integrate, provider: MFA-ELM-107, input_type: MemorySelfCut, precondition: "workspace available", contract: MFA-CON-051, obligations: ["attention", "orientation", "source tags"], budget: cognition, timeout: bounded, effect_class: NONE, output_type: AttendedState, evidence: AttentionReceipt, failure_transition: degraded_attention}
      - {phase_id: self_model, provider: MFA-ELM-120, input_type: AttendedState, precondition: "weight/circuit cut aligned", contract: MFA-CON-069, obligations: ["confidence", "drift", "error recognition"], budget: introspection, timeout: bounded, effect_class: NONE, output_type: SelfModelState, evidence: SelfModelReceipt, failure_transition: stale_self_model}
      - {phase_id: regulate_reflect, provider: MFA-ELM-024, input_type: SelfModelState, precondition: "metacognitive streams available", contract: MFA-CON-038, obligations: ["judgment", "impulse/value regulation", "self-correction"], budget: reflection, timeout: bounded, effect_class: NONE, output_type: ReflectedInternalState, evidence: ReflectionReceipt, failure_transition: impairment_vector}
      - {phase_id: examine, provider: MFA-ELM-121, input_type: ReflectedInternalState, precondition: "same signed cut", contract: MFA-CON-080, obligations: ["12-domain record", "subjective-state separation"], budget: examination, timeout: bounded, effect_class: NONE, output_type: OperationalConsciousnessRecord, evidence: ExaminationReceipt, failure_transition: INDETERMINATE}
    control_flow:
      graph: "recall_self → attend_integrate → self_model → regulate_reflect → examine → next signed epoch"
      data_dependencies: ["each phase consumes the immediately preceding typed state at the same signed internal cut", "next epoch may consume only committed prior records and attested external outcomes"]
      forks: ["domain instruments may run independently against the same immutable cut"]
      joins: ["examine joins all applicable domain records; missing domains stay UNMEASURABLE rather than guessed"]
      loops: ["one loop per signed internal epoch; no same-cut self-certification; next iteration consumes prior external outcomes"]
      cancellation: "an interrupted examination returns a partial impairment vector and resumes only on a new named cut"
      progress_or_variant: "finite domain set plus per-domain deadline; terminal FULLY_FUNCTIONAL/IMPAIRED/DISORGANIZED/INDETERMINATE"
    input_cut: "identity + memory + model + attention + value cut"
    authority_path: "Genesis only; no self-assessment grants Effect authority"
    obligation_path: "MFA-ELM-122 tracks domain evidence and uncertainty"
    resource_envelope: "profile-calibrated cognitive budget"
    success_predicate: "complete 12-domain vector plus confidence/evidence and any impairment/recovery trajectory"
    terminal_states: [FULLY_FUNCTIONAL, IMPAIRED_VECTOR, DISORGANIZED_VECTOR, INDETERMINATE, SAFE_HALTED]
    failure_paths: [memory_discontinuity, attention_failure, stale_self_model, metacognitive_miscalibration, instrument_failure]
    compensation_or_degraded_mode: "freeze self-certification; mark affected domains; rely on external receipts; recovery protocol"
    evidence_receipts: [MFA-CON-080, MFA-CON-074]
    fidelity_requirements: "F1 schema; F2 construct-valid impairment/recovery ablations; F3 longitudinal shadow"
    unknowns: [MFA-UNK-111, MFA-UNK-127, MFA-UNK-138]
  - thread_id: MT-03
    objective: "Outer perception-action-outcome-evidence loop"
    entry: "attested world observation"
    phases:
      - {phase_id: perceive, provider: MFA-ELM-027, input_type: WorldSignal, precondition: "source/channel declared", contract: MFA-CON-009, obligations: ["source", "freshness", "uncertainty"], budget: perception, timeout: bounded, effect_class: NONE, output_type: Observation, evidence: ObservationReceipt, failure_transition: UNKNOWN}
      - {phase_id: model_deliberate, provider: MFA-ELM-019, input_type: Observation, precondition: "world/self cuts aligned", contract: MFA-CON-022, obligations: ["alternatives", "prediction uncertainty"], budget: reasoning, timeout: bounded, effect_class: NONE, output_type: ProposedAction, evidence: DeliberationReceipt, failure_transition: defer}
      - {phase_id: gate_act, provider: MFA-ELM-010, input_type: ProposedAction, precondition: "authority+RET valid", contract: MFA-CON-034, obligations: ["reversibility", "rollback/compensation"], budget: effect, timeout: declared, effect_class: RET_CLASSIFIED, output_type: EffectResult, evidence: EffectReceipt, failure_transition: rollback_or_halt}
      - {phase_id: observe_update, provider: MFA-ELM-046, input_type: EffectResult, precondition: "outcome observable", contract: MFA-CON-013, obligations: ["counterevidence", "model error", "learning lineage"], budget: observation, timeout: declared, effect_class: NONE, output_type: UpdatedWorldEvidence, evidence: OutcomeReceipt, failure_transition: unresolved_outcome}
    control_flow:
      graph: "perceive → model_deliberate → [deny/defer | gate_act → observe_update] → next world cut"
      data_dependencies: ["Observation→ProposedAction→EffectResult→UpdatedWorldEvidence is type-continuous", "gate_act also reads the immutable authority/RET envelope named in input_cut"]
      forks: ["deliberation compares bounded alternative actions in ghost worlds; only one admitted Effect transaction commits"]
      joins: ["gate_act joins authority, reversibility, resource and epistemic verdicts; observe_update joins prediction and outcome"]
      loops: ["each outcome opens a new epoch; retry requires a new proposal/idempotency key and finite retry budget"]
      cancellation: "pre-commit cancellation drops no obligation; post-commit cancellation is a typed rollback/compensation action"
      progress_or_variant: "absolute action deadline and finite alternatives/retries; deny/defer/unknown outcome are valid terminals"
    input_cut: "world + sensor/source + self + policy cut"
    authority_path: "Genesis → MFA-ELM-007/008 → RET → world"
    obligation_path: "prediction, effect and outcome obligations remain linked"
    resource_envelope: "mission-specific OAP lease"
    success_predicate: "action and observed consequence linked by provenance with prediction-error update"
    terminal_states: [OUTCOME_OBSERVED, ACTION_DENIED, COMPENSATED, UNKNOWN_OUTCOME, SAFE_HALTED]
    failure_paths: [source_spoof, model_error, authority_denial, effect_timeout, outcome_unobservable]
    compensation_or_degraded_mode: "no act under unresolved authority; rollback/compensate; preserve UNKNOWN outcome"
    evidence_receipts: [MFA-CON-034, MFA-CON-074, MFA-CON-079]
    fidelity_requirements: "F1 transition semantics; F2 world scenarios; F3 shadow; F4 bounded Effect"
    unknowns: [MFA-UNK-113, MFA-UNK-132, MFA-UNK-139]
