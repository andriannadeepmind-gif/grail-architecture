change:
  MFA-ELM-109:
    _add: true
    name: Ontology Genesis Engine (OGE)
    stratum: S2
    plane: genesis
    corresponds_to: []
    delta: NEW
    maturity: X
    statement: 'Η έννοια είναι δέσμευση: γεννιέται όταν ένα υποψήφιο intension (πρόγραμμα ή λογικός ορισμός) πάνω σε extension (σύνολο δεσμεύσεων) αποδίδει μετρήσιμο
      κέρδος περιγραφής+πρόβλεψης G>θ σε σφραγισμένο split· κάθε συγχώνευση/διάσπαση είναι ΠΡΟΣΦΥΓΗ (Court-lite, EIM-ανεξάρτητοι αξιολογητές) με LossMap δεσμευμένο,
      ώστε η έκταση κάθε καταργημένης έννοιας να είναι ανακτήσιμη — NON-COLLAPSE ως θεώρημα της γενεαλογίας, όχι ως ελπίδα.'
    purpose: 'Αυτόνομος σχηματισμός οντολογίας (§8 #3): το σύστημα γεννά, διασπά, συγχωνεύει και αποσύρει έννοιες από τα δικά του δεδομένα/αποτυχίες πρόβλεψης, με
      γενεαλογία και χωρίς σιωπηλή κατάρρευση εννοιών.'
    capabilities:
    - MFA-CAP-089
    source_provenance:
    - MFA-MECH-026
    - Ω-MAXIMUM NON-ABSTENTION MANDATE 0.4.0 (creator-authorized) §6/§7/§8
    - FCA (Ganter & Wille 1999)
    - DreamCoder (Ellis et al. 2021)
    assumptions:
    - το MDL+pred κέρδος συσχετίζεται με χρησιμότητα (OGE-E2)
    dependencies:
    - MFA-ELM-025
    - MFA-ELM-028
    - MFA-ELM-048
    - MFA-ELM-083
    - MFA-ELM-086
    - MFA-ELM-098
    - MFA-ELM-100
    - MFA-ELM-105
    - MFA-ELM-110
    - MFA-ELM-111
    interfaces:
    - MFA-CON-054
    authority: Γένεση/απόσυρση = Genesis plane, χωρίς εξουσία επίδρασης· merge/split = Proceeding (Court-lite) με EIM-ανεξάρτητους αξιολογητές· τα κατώφλια θ = πολιτική
      (LPA Tier ORDER)· ο δημιουργός μπορεί να παγώσει έννοιες (L3 pin).
    state_model: 'Μεταβλητές: O_t (τρέχουσα οντολογία ως δέσμευση)· Q_t (ουρά ανωμαλιών με VOI)· Cand_t (υποψήφιες έννοιες με G, split ids)· Pending_t (προσφυγές
      συγχώνευσης/διάσπασης)· L_t (γενεαλογία)· θ_birth, θ_merge (κατώφλια — πολιτική, MFA-DEC-005 ORDER) ‖ OBSERVE: residual r εισέρχεται στην Q_t με VOI(r) = αναμενόμενη
      μείωση PredLoss· PROPOSE: Cand ← FCA-lattice(K(r)) ∪ ProgramInduction(E) · κάθε υποψήφια με G σε σφραγισμένο split· BIRTH: G(c) > θ_birth ∧ ¬∃c′∈C: sim(I_c,
      I_c′) > 1−ε ⇒ c ∈ C_{t+1}, L += birth(c)· MERGE/SPLIT: μόνο ως Proceeding με LossMap· PASS ⇒ O_{t+1}, L += merge/split, Σ migration μέσω CC schema lineage …'
    failure_modes:
    - mode: Έκρηξη εννοιών (over-birth)
      response: θ_birth αυξάνεται (RateBounds MFA-DEC-019)· batch ως Proceeding
    - mode: Codebook-style collapse (πολλές έννοιες ↦ μία)
      response: merge απορρίπτεται εξ ορισμού (MFA-INV-078)
    - mode: Έννοιες που μαθαίνουν sealed δεδομένα
      response: MFA-VO-063 FAIL, υποψήφια απορρίπτεται, cut μολυσμένο
    - mode: Σχήμα που σπάει καταναλωτές
      response: BIRTH αναβάλλεται· η έννοια ζει ως draft χωρίς Σ
    - mode: Αντιπαλική ανωμαλία (τεχνητό residual για να γεννηθεί έννοια-δούρειος)
      response: Court-lite με CAM-NS· γέννηση σε quarantine namespace
    alternatives:
    - registry-only (0.3.0, MFA-ELM-083)
    - LLM-προτεινόμενες έννοιες χωρίς κέρδος/γενεαλογία
    conflicts:
    - MFA-CFL-039
    unknowns:
    - MFA-UNK-115
    verification:
    - MFA-VO-068
    falsifier: Μετά από 10⁴ ανωμαλίες καμία γέννηση με G>θ σε σφραγισμένο split (ο μηχανισμός δεν βρίσκει έννοιες)
    resource_model: 'DEP-1: k≤12, 10² ανωμαλίες/ημέρα, CPU· DEP-2: k≤20, 10³/ημέρα, program induction σε GPU (ώρες)· DEP-3+: συνεχής· μνήμη O(|C|·|E| δείγμα)'
    evolution_path: 'Η γένεση εννοιών είναι μάθηση δομής (μη-παραμετρική) που τροφοδοτεί την παραμετρική (SMF: έννοιες ως tokens/heads) και το CDCE (μεταβλητές)·
      το ίδιο το OGE βελτιώνεται σε RVSI L2 (θ, k, οικογένεια intension) με CapabilityGrowthRecord.'
    affected_by:
    - MFA-TEL-08
    dose: 1
    ablation_kt: 'χωρίς OGE καμία έννοια πέρα από το χειροποίητο registry: OGE-E2 (MDL κέρδος ≥ 10 %) δεν μπορεί να τρέξει· KT-12 (νέο επιστημονικό πεδίο) απαιτεί
      ανθρώπινη οντολογία'
    epistemic_status: NOVEL SYNTHESIS
  MFA-ELM-110:
    _add: true
    name: Causal Discovery & Counterfactual Engine (CDCE)
    stratum: S2
    plane: genesis
    corresponds_to: []
    delta: NEW
    maturity: X
    statement: 'Το ledger είναι παρεμβατικό dataset: κάθε Effect με receipt είναι do(X=x) με γνωστό στόχο και χρόνο· κάθε Genesis-plane διακλάδωση είναι παρατηρησιακό
      στρώμα· η αιτιακή δομή είναι ΔΕΣΜΕΥΣΗ (CausalGraphCommitment) με επιστημική κατάσταση ανά ακμή (OBSERVATIONAL / INTERVENTION-SUPPORTED / REFUTED / UNDETERMINED)·
      οι νέες παρεμβάσεις προτείνονται ως Effects με VOI/κόστος και περνούν από RET (πρώτα Genesis/LWM, μετά REVERSIBLE στο Effect plane, ποτέ IRREVERSIBLE χωρίς
      AutonomyEnvelope)· κάθε αντιπαραγοντική απάντηση φέρει τύπο αβεβαιότητας και επιστρέφει UNKNOWN(CAUSAL_UNDERDETERMINED) με σχέδιο παρεμβάσεων όταν το ερώτημα
      δεν ταυτοποιείται.'
    purpose: 'Αιτιακή ανακάλυψη (§8 #5) από παρατηρήσεις ΚΑΙ παρεμβάσεις που το ίδιο το σύστημα προτείνει και εκτελεί υπό RET· πλήρης αντιπαραγοντική προσομοίωση
      (§8 #6) με τυπωμένη αβεβαιότητα.'
    capabilities:
    - MFA-CAP-090
    - MFA-CAP-091
    source_provenance:
    - MFA-MECH-027
    - Ω-MAXIMUM NON-ABSTENTION MANDATE 0.4.0 (creator-authorized) §6/§7/§8
    - FCI/GIES (Spirtes et al. 2000· Hauser & Bühlmann 2012)
    - twin networks (Balke & Pearl 1994)
    assumptions:
    - faithfulness ανά ακμή ελέγξιμη με παρεμβάσεις
    dependencies:
    - MFA-ELM-001
    - MFA-ELM-007
    - MFA-ELM-010
    - MFA-ELM-019
    - MFA-ELM-022
    - MFA-ELM-023
    - MFA-ELM-098
    - MFA-ELM-105
    - MFA-ELM-109
    - MFA-ELM-111
    - MFA-ELM-126
    interfaces:
    - MFA-CON-055
    authority: Ανακάλυψη = Genesis plane χωρίς εξουσία· προτάσεις παρεμβάσεων = Effects μέσω PDP + RET + AutonomyEnvelope· προϋπολογισμοί ανά κλάση = MFA-DEC-025·
      αντιπαραγοντικά προς LPA ως ΠΡΟΒΛΕΨΕΙΣ (Prediction Doctrine MFA-CAP-072), ποτέ ως γεγονότα.
    state_model: 'Μεταβλητές: M_t (τρέχον SCM ensemble, B bootstrap δείγματα)· EdgeStatus_t· I_t (παρεμβάσεις που εκτελέστηκαν/εκκρεμούν)· Budget_t (παρεμβάσεις ανά
      RET class, MFA-DEC-025)· OpenQueries_t (αντιπαραγοντικά ερωτήματα UNKNOWN με σχέδιο) ‖ INGEST: νέο cut → ενημέρωση παρατηρησιακών στρωμάτων και InterventionRecords
      από receipts· DISCOVER: M_t ← FCI+GIES με χρονικούς περιορισμούς → ensemble· EdgeStatus από υποστήριξη· PROPOSE: π ← argmax VOI/cost υπό RET· Genesis-first
      (LWM/DST)· EXECUTE: Effect-plane παρέμβαση μόνο με AutonomyGrant REVERSIBLE ή ρητή έγκριση· receipt → I_{t+1}· UPDATE: p_e ανανεώνεται …'
    failure_modes:
    - mode: Παραβίαση faithfulness (ακυρωτικές διαδρομές)
      response: ακμή UND· προτείνεται παρέμβαση· ποτέ σημειακή απάντηση
    - mode: Λανθάνοντες συγχυτές
      response: PARTIAL_BOUNDS· αναζήτηση proxy μεταβλητών από OGE
    - mode: Παρέμβαση με ανεπιθύμητη επίδραση
      response: Both → Court· παρέμβαση αναβάλλεται
    - mode: Data dredging (πολλαπλοί έλεγχοι)
      response: Benjamini–Hochberg ανά cut· ακμές OBS με FDR-διορθωμένο p
    - mode: Αντιπαλικό ledger (ψεύτικα receipts)
      response: παρέμβαση εξαιρείται (taint)· MFA-INV-070
    alternatives:
    - SCM δεδομένο (0.3.0, MFA-ELM-022)
    - LWM-only πρόβλεψη
    conflicts:
    - MFA-CFL-040
    unknowns:
    - MFA-UNK-116
    verification:
    - MFA-VO-069
    falsifier: SHD με VOI-παρεμβάσεις όχι καλύτερο από τυχαίες σε καμία ρύθμιση (ο επιλογέας δεν προσθέτει)
    resource_model: 'DEP-1: n≤50 μεταβλητές, B=20, CPU λεπτά/cut· DEP-2: n≤500, B=50, GPU για μηχανισμούς· DEP-3+: n≤10⁴ με sparsity (d≤4)· LWM rollouts ms/κόμβο'
    evolution_path: 'Δομική μάθηση (μη-παραμετρική) + μηχανισμοί F μαθημένοι παραμετρικά (SMF) με provenance ανά ακμή· ενεργητική μάθηση παρεμβάσεων (VOI)· υπό RVSI
      L2: α, d, B, VOI-εκτιμητής.'
    affected_by:
    - MFA-TEL-08
    dose: 1
    ablation_kt: 'χωρίς CDCE το KT-12 και τα αντιπαραγοντικά μένουν σε δεδομένο SCM: CDCE-E1 SHD δεν βελτιώνεται με παρεμβάσεις'
    epistemic_status: NOVEL SYNTHESIS
  MFA-ELM-111:
    _add: true
    name: Abductive Hypothesis Engine (AHE)
    stratum: S2
    plane: both
    corresponds_to: []
    delta: NEW
    maturity: X
    statement: Υπόθεση = τυπωμένη δέσμευση H = ⟨explanandum, μοντέλο/πρόγραμμα, falsifier, νέες προβλέψεις, κόστος ελέγχου⟩· χωρίς falsifier δεν εισάγεται (η απόρριψη
      καταγράφεται). Τρεις EIM-ανεξάρτητες γεννήτριες (ILP πάνω στην οντολογία, αναζήτηση προγραμμάτων στο Skill Library, παραμετρική πρόταση από κυρίαρχο μοντέλο)
      ανταγωνίζονται· κατάταξη με Expected Falsification Value EFV(H) = P(διάψευση)·InfoGain / cost· έλεγχος Genesis-first (LWM/World Twin/DST) και μετά υπό RET·
      επιζώσες υποθέσεις προάγονται μηχανικά σε OGE (έννοιες) ή CDCE (ακμές)· επαναλαμβανόμενα εξηγητικά σχήματα συμπιέζονται (anti-unification) σε βιβλιοθήκη.
    purpose: 'Εφεύρεση υποθέσεων (§8 #8): από ανωμαλία σε σύνολο ανταγωνιστικών, διαψεύσιμων υποθέσεων με σχεδιασμένο πείραμα, χωρίς ανθρώπινη πρόταση.'
    capabilities:
    - MFA-CAP-092
    source_provenance:
    - MFA-MECH-028
    - Ω-MAXIMUM NON-ABSTENTION MANDATE 0.4.0 (creator-authorized) §6/§7/§8
    - ILP/Popper (Cropper & Morel 2021)
    - abductive LP (Kakas et al. 1992)
    assumptions:
    - τρεις γεννήτριες EIM-ανεξάρτητες διαθέσιμες
    dependencies:
    - MFA-ELM-025
    - MFA-ELM-028
    - MFA-ELM-030
    - MFA-ELM-050
    - MFA-ELM-091
    - MFA-ELM-100
    - MFA-ELM-106
    - MFA-ELM-109
    - MFA-ELM-110
    - MFA-ELM-112
    interfaces:
    - MFA-CON-056
    authority: Γένεση/κατάταξη = Genesis plane· έλεγχοι στο Effect plane μόνο υπό RET + envelope· PROMOTE = Proceeding-lite όταν αγγίζει Tier-0/1 έννοιες· ο δημιουργός
      βλέπει κάθε υπόθεση στο cockpit (MFA-ELM-091).
    state_model: 'Μεταβλητές: A_t ουρά ανωμαλιών· S_t σύνολα υποθέσεων ανά ανωμαλία με posterior· Lib_t βιβλιοθήκη σχημάτων· Tests_t (προγραμματισμένα/εκτελεσμένα)·
      GenStats_t (calibration ανά γεννήτρια — proper scoring από HELD_OUT) ‖ ANOMALY: residual > θ ή Void entry ⇒ a ∈ A_t· GENERATE: S_a ← ∪_g Gen_g(a, Lib) με g
      EIM-ανεξάρτητες· type-check φ (χωρίς falsifier ⇒ REJECTED_UNFALSIFIABLE, καταγράφεται)· RANK: EFV· schedule top-k υπό budget· TEST: venue Genesis-first· Effect
      μόνο RET REVERSIBLE/envelope· UPDATE: Bayesian posterior· διαψευσμένες → FALSIFIED (μένουν)· επιζώσες με N_H επιβεβαιωμένες → PROMOTE …'
    failure_modes:
    - mode: Ad hoc υποθέσεις (εξηγούν μόνο το explanandum)
      response: REJECTED_AD_HOC (MFA-INV-082)
    - mode: Γεννήτρια που κυριαρχεί (mode collapse)
      response: quota ανά γεννήτρια· EIM έλεγχος
    - mode: P-hacking μέσω πολλών ελέγχων
