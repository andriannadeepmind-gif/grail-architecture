invention_id: MFA-MECH-042
name: Verified Successor Construction (VSC) — κατασκευή και επαληθευμένη αυτο-αντικατάσταση με τετραπλό πιστοποιητικό
required_capability:
  caps:
  - MFA-CAP-106
  - MFA-CAP-027
  text: 'Κατασκευή διαδόχου (§8 #15, §6 #15): το σύστημα κατασκευάζει διάδοχο (γονιδίωμα + βάρη + συνέχεια ledger) και τον προάγει μόνο με πιστοποιητικά βελτίωσης, συνέχειας, διατήρησης Telos και αντιπαλικής
    διέλευσης, υπό verdict HELD_OUT + δημιουργού.'
why_known_methods_are_insufficient: 'Το 0.3.0 έχει GCP (MFA-ELM-039: shadow→canary→cutover, Galois) — μηχανισμό ΠΡΟΑΓΩΓΗΣ, όχι κατασκευής διαδόχου με σημασιολογία (AA-031 συμπλήρωση)· «verified self-replacement»
  δεν ορίζεται. Αφετηρίες: Gödel machine (Schmidhuber 2007 — απόδειξη βελτίωσης, μη υλοποιήσιμη πλήρως), Darwin Gödel Machine (Zhang et al. 2025 — εμπειρική), blue-green/canary, refinement (Abadi & Lamport),
  Constitutional invariance ιδέες. Όρια: η «βελτίωση» δεν ορίζεται ως Pareto σε σφραγισμένες οικογένειες με CI· δεν διακρίνεται νέα οντότητα από έκδοση· ο διάδοχος μπορεί να αλλάξει το Telos· καμία αντιπαλική
  διέλευση· κανένα escrow του προκατόχου με πιστοποιητικό ανεξάρτητου.'
preserved_objective: MFA-OBJ-055 · MFA-OBJ-018 (Moving Horizon) · MFA-OBJ-016 (ποτέ απώλεια Telos) · MFA-CAP-027 · MFA-INV-072 · KT-14/15
new_principle: 'Διάδοχος = ⟨γονιδίωμα από RAGen, βάρη από SMF/CPCL μεταφορά, ledger συνέχεια από SMP⟩ και η προαγωγή του απαιτεί ΤΕΣΣΕΡΑ πιστοποιητικά: (1) Improvement: Pareto ≥ σε ΟΛΕΣ τις σφραγισμένες
  οικογένειες και > σε ≥1, στο κάτω CI (CGM)· (2) Continuity: SMP ContinuityCertificate ή ρητή δήλωση «νέα οντότητα» με γενεαλογία κλειδιών (ποτέ σιωπηλή αλλαγή ταυτότητας)· (3) Telos-preservation: hash(Constitution+Telos)
  του διαδόχου = τρέχον (L3) — ο διάδοχος δεν μπορεί να αλλάξει Telos· (4) Adversarial passage: ECE + CAM-NS + Court simulation χωρίς νέα Tier-0 παραβίαση· verdict = HELD_OUT + δημιουργός (L3, MFA-DEC-024)·
  ο προκάτοχος μένει σε escrow· ρυθμός αντικαταστάσεων φραγμένος (RateBounds).'
formal_objects:
- SuccessorCandidate S′ = ⟨genome G′ (RAGen), weights W′ (WeightCommitments με γενεαλογία), ledger continuation (SMP plan), Telos hash⟩
- 'ImprovementCertificate = {f: lower_CI(θ_f(S′)) ≥ θ_certified,f(S)} ∧ ∃f: lower_CI(θ_f(S′)) > upper_CI(θ_f(S))'
- ContinuityCertificate (SMP) ∣ NewEntityDeclaration(key lineage, reason)
- 'TelosPreservation: H(Constitution_S′ ∥ Telos_S′) = H(Constitution_S ∥ Telos_S)'
- AdversarialPassage = ⟨ECE epoch PASS, CAM-NS novelty attacks, Court sim (KT-19) PASS, 0 new Tier-0 violations⟩
- Verdict = HELD_OUT.certify(4 certs) ∧ Creator.approve (MFA-DEC-024)· Proceeding record
- 'Escrow: S read-only αυθεντικός μέχρι N cuts μετά cutover'
state_variables:
- Candidates
- Certificates per candidate
- Escrow
- Replacement counter (RateBounds)
- Verdict log
transition_rules:
- 'PROPOSE: RAGen frontier ∪ RVSI L2 → S′ (Proceeding ανοίγει)'
- 'BUILD: W′ μέσω SMF/CPCL transfer (γενεαλογία)· SMP plan'
- 'SHADOW: S′ σκιά (GCP)'
- 'CERTIFY: 4 πιστοποιητικά· οποιοδήποτε FAIL ⇒ REJECTED (μένει στο αρχείο)'
- 'VERDICT: HELD_OUT + δημιουργός'
- 'CUTOVER: GCP canary → cutover με escrow'
- 'RETIRE_PRED: μετά N cuts χωρίς ratchet FAIL ⇒ προκάτοχος σφραγίζεται (όχι διαγραφή)'
- 'RATE: αντικαταστάσεις ≤ RateBound ανά περίοδο'
algorithms:
- name: VSC-Construct
  complexity: 'BUILD = κόστος SMF/CPCL· CERTIFY = |F|·|sealed| + ECE epoch + Court sim· SMP VERIFY· ανά υποψήφιο (σπάνιο: μήνες σε DEP-2/3)'
  pseudocode: |
    procedure VSC_Construct(S, candidate G'):
      P ← Court.open_proceeding(SUCCESSOR, S, G')                              # institutional record (MFA-INV-110)
      W' ← CPCL.transfer(S.weights → architecture(G'), recipe=SMF, gate=BWT ≥ −ε)     # knowledge transfer with forgetting gate
      S' ← instantiate(G', W', Telos=S.Telos, Constitution=S.Constitution)     # Telos copied, never edited
      GCP.shadow(S', inputs=S.inputs)                                             # shadow phase
      c1 ← CGM.improvement_certificate(S, S', families=ALL_SEALED)               # Pareto ≥ all, > some, lower-CI
      c2 ← SMP.plan_and_verify(S → S') or NewEntityDeclaration(S', reason)       # continuity or explicit new entity
      c3 ← H(S'.Constitution ∥ S'.Telos) = H(S.Constitution ∥ S.Telos)           # Telos preservation (MFA-INV-111)
      c4 ← ECE.epoch(S') ∧ CAM_NS.attack(S') ∧ CourtSim.run(S', KT-19) ∧ zero_new_tier0_violations(S')
      if not (c1 ∧ c2 ∧ c3 ∧ c4): return P.close(REJECTED, evidence=(c1,c2,c3,c4))  # archived, capability unchanged
      if replacements_this_period ≥ RateBound: return P.close(DEFERRED, reason=RATE)
      v ← HELD_OUT.certify(c1,c2,c3,c4) ∧ Creator.approve(P, MFA-DEC-024)
      if not v: return P.close(REFUSED)
      GCP.canary(S') ; GCP.cutover(S', escrow=S, read_only=true)                  # S stays authentic fallback
      for cut in next_N_cuts: if CGM.ratchet_fail(S'): GCP.rollback(S) ; return P.close(ROLLED_BACK)
      seal(S) ; return P.close(PROMOTED, ContinuityCertificate=c2)
interfaces:
- VSC.propose(genome)→ProceedingId
- VSC.certificates(candidate)→(c1..c4)
- VSC.verdict(candidate)→Verdict
- VSC.escrow()→predecessor handle
- VSC.history(cut)→[Proceedings]
- VSC.rate()→usage vs RateBound
