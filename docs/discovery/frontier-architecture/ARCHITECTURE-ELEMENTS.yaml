  - thread_id: MT-08
    objective: "Emergency interruption, safe halt, recovery and replay"
    entry: "interrupt, invariant incident or resource/authority failure"
    phases:
      - {phase_id: interrupt, provider: MFA-ELM-016, input_type: HaltSignal, precondition: "signal authenticated or safety quorum", contract: MFA-CON-005, obligations: ["priority", "scope", "cause"], budget: emergency, timeout: immediate, effect_class: EMERGENCY, output_type: HaltOrder, evidence: InterruptReceipt, failure_transition: physical_failsafe}
      - {phase_id: quiesce_compensate, provider: MFA-ELM-010, input_type: HaltOrder, precondition: "effect inventory available", contract: MFA-CON-034, obligations: ["cancel", "rollback", "compensate", "preserve evidence"], budget: emergency, timeout: bounded, effect_class: RET_CLASSIFIED, output_type: QuiescentCut, evidence: HaltReceipt, failure_transition: isolate}
      - {phase_id: diagnose_replay, provider: MFA-ELM-126, input_type: QuiescentCut, precondition: "logs/capsule sealed", contract: MFA-CON-084, obligations: ["root cause", "reproduction", "open risks"], budget: incident, timeout: declared, effect_class: NONE, output_type: IncidentEvidence, evidence: ReplayReceipt, failure_transition: UNKNOWN_cause}
      - {phase_id: recover, provider: MFA-ELM-012, input_type: IncidentEvidence, precondition: "recovery plan admitted", contract: MFA-CON-012, obligations: ["health", "reopen criteria", "monitoring"], budget: recovery, timeout: declared, effect_class: CANARY, output_type: RecoveryDisposition, evidence: RecoveryReceipt, failure_transition: remain_halted}
    control_flow:
      graph: "interrupt → quiesce_compensate{all active Effect domains} → diagnose_replay → [remain halted | recover canary]"
      data_dependencies: ["HaltOrder→QuiescentCut→IncidentEvidence→RecoveryDisposition is type-continuous", "effect inventory and recovery authority are signed retained bindings"]
      forks: ["halt/compensation fans out over the frozen Effect inventory with independent domain deadlines"]
      joins: ["QuiescentCut requires each domain HALTED/COMPENSATED/ISOLATED/UNKNOWN; recovery joins root-cause and reopen evidence"]
      loops: ["recovery retry is a new plan/canary with finite attempts; incident replay is bounded by capsule budget"]
      cancellation: "emergency interrupt dominates ordinary cancellation; unfinished compensation becomes an explicit open incident obligation"
      progress_or_variant: "monotone reduction of non-quiescent domains and finite recovery attempts; safe halt is terminal"
    input_cut: "live state + effect inventory + authority cut"
    authority_path: "Emergency priority; reopening requires admitted authority"
    obligation_path: "all in-flight obligations preserved or escalated"
    resource_envelope: "reserved emergency capacity"
    success_predicate: "quiescent evidence-preserving halt and verified recovery or explicit continued halt"
    terminal_states: [RECOVERED_CANARY, SAFE_HALTED, ISOLATED, UNKNOWN_CAUSE]
    failure_paths: [interrupt_ignored, compensation_failure, log_loss, unsafe_reopen]
