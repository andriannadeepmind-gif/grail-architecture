- 'MFA-CON-061 (Sovereignty Transition: index/stage/gates/advance/regress)'
- MFA-CON-047 (SMF)
- MFA-CON-041 (EIM)
- MFA-CON-005 (PDP / DisclosureGrant)
invariants:
- 'MFA-INV-092: προαγωγή σταδίου μόνο με parity σε σφραγισμένο σύνολο από HELD_OUT + N συνεχόμενα cuts· υποχώρηση σταδίου ποτέ σιωπηλή'
- 'MFA-INV-093: το ratchet ισχύει στην ποιότητα ανά οικογένεια — η κυριαρχία δεν αγοράζεται με υποβάθμιση ποιότητας'
authority_model: Πύλες = MFA-DEC-021 (δημιουργός)· advance S3→S4 = δημιουργός (ανάκληση grants)· regress αυτόματο (fail-safe προς ποιότητα)· ο router (PDE, MFA-MECH-019) εκτελεί, δεν αποφασίζει.
learning_model: Το SMF/PRR/CPCL παράγουν την κυρίαρχη στοίβα· το STP μετρά και ρυθμίζει· τα κατώφλια/ε υπό RVSI L2 μόνο προς αυστηρότερα.
failure_modes:
- mode: Ψευδής ισοτιμία (sealed set μολυσμένο)
  detection: canaries + DataManifest
  response: MFA-VO-063· stage παγώνει
- mode: Πάροχος «αξιολογεί» το distilled παιδί του
  detection: EIM lineage
  response: απαγορεύεται S3 ρόλος
- mode: Ταλάντωση σταδίων
  detection: advance/regress > k σε M cuts
  response: 'hysteresis: N αυξάνεται'
- mode: Πάροχος καταργείται εξωτερικά πριν S2
  detection: KT-01
  response: S1 σκιά ενεργοποιείται με typed degraded mode
- mode: Κυριαρχία σε proposal αλλά όχι σε evaluation
  detection: SI ανά άξονα
  response: δηλώνεται ανά άξονα· καμία ολική δήλωση
containment: Fallback πάντα διαθέσιμο μέχρι S4· S4 με σφραγισμένη διαδρομή επαναφοράς· ποιότητα ratchet.
reversibility_class: REVERSIBLE μέχρι S3· S4 (ανάκληση grants) IRREVERSIBLE-PREAUTHORIZED από δημιουργό με διαδρομή επαναφοράς
resource_complexity: Μέτρηση αμελητέα· το κόστος είναι της κυρίαρχης στοίβας (SMF DEP-2+)· parity tests ανά cut O(|sealed|)
scaling_law: SI αναμένεται σιγμοειδές ανά οικογένεια με το compute της SMF· οι «εύκολες» οικογένειες (drafting) πρώτες· MFA-VO-075 = SI καμπύλη ανά δόση.
verification_strategy: 'MFA-VO-075: STP-E1 (μία οικογένεια σε S2 με parity) F3· STP-E2 (SI μονότονο ανά δόση) F3/F4· property: advance ⇒ parity ∧ streak (F1)· KT-01 drill σε κάθε στάδιο'
experiments:
- id: STP-E1
  design: 'Οικογένεια drafting: κυρίαρχη στοίβα (SMF adapters+PRR) έναντι καλύτερου παρόχου σε 500 σφραγισμένα έργα, HELD_OUT scorer'
  preregistered_criterion: non-inferiority ε=2 pp με 95 % CI για N=3 cuts ⇒ S2· αλλιώς FAIL με απόσταση καταγεγραμμένη
- id: STP-E2
  design: SI ανά οικογένεια/άξονα ανά δόση 1→4
  preregistered_criterion: SI_total μη-φθίνον ανά δόση ΚΑΙ ≥ 3 οικογένειες σε S3+ μέχρι τη Δόση 4· ποιότητα ratchet 0 παραβιάσεις
falsifiers:
- 'STP-E1: καμία οικογένεια σε ισοτιμία μέσα στον DEP-2 προϋπολογισμό — διαψεύδεται η υπόθεση «SMF-adapters αρκούν» (η κυριαρχία μένει στόχος· επόμενος μηχανισμός: DEP-3 recipes/PRR/CPCL)'
- SI αυξάνει ενώ η ποιότητα πέφτει χωρίς regress (παραβίαση MFA-INV-093 = σφάλμα υλοποίησης)
