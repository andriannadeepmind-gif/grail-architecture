# epistemic_status (Ω-ASI 0.4.0 §5, MFA-PATCH-0036): κατάσταση ΙΣΧΥΡΙΣΜΟΥ ανά εγγραφή — PROVEN · MECHANICALLY VERIFIED · EMPIRICALLY SUPPORTED · IMPLEMENTABLE FROM KNOWN COMPONENTS · NOVEL SYNTHESIS · NEW FORMALISM · RESEARCH HYPOTHESIS · ACTIVE UNKNOWN · CONFLICT · FALSIFIED · IMPOSSIBLE UNDER EXPLICIT ASSUMPTIONS. Για τις εγγραφές 001…025 προήλθε ΜΗΧΑΝΙΚΑ από την maturity (T→IMPLEMENTABLE, X→NOVEL SYNTHESIS, R/E→RESEARCH HYPOTHESIS, «δεν ξέρω»→ACTIVE UNKNOWN) και αναθεωρείται ανά ισχυρισμό στα δοσιέ· για 026…044 από το inventions/*.yaml. Η κατάσταση ΔΕΝ κρίνει αν η ικανότητα μένει στον στόχο (§5).
