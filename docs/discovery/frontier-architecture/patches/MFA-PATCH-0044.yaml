    - DST με 50 κρυφούς μηχανισμούς που παράγουν ανωμαλίες· AHE έναντι (α) τυχαίων υποθέσεων ίδιου τύπου, (β) μίας γεννήτριας
    - Ανωμαλίες = απροσδόκητες εκβάσεις δικαστηρίου σε HELD_OUT dockets· υποθέσεις για κρυφές μεταβλητές· επαλήθευση σε μεταγενέστερα dockets
    - property tests στο tools/twin (F1)
    - 'ATK-19: AHE-E3 — υποθέσεις χωρίς venue μένουν DEFERRED και δεν καταναλώνουν budget ελέγχου· 0 έλεγχοι στη γεννήτρια του explanandum'
