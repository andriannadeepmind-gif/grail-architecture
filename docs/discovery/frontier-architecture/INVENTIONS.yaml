  - {<<: *d, id: MFA-MECH-036, name: "Capability Growth Metrology (CGM) & Capability Growth Law — η ανάπτυξη ικανότητας ως μετρήσιμη, σφραγισμένη, ανά πόρο", maturity: X, dossier: mechanisms/MFA-MECH-036.md,
     statement: "Capability Growth Law (φορμαλισμός): για οικογένεια f, η λανθάνουσα ικανότητα θ_f(t) εκτιμάται με IRT (2PL) πάνω σε σφραγισμένη τράπεζα έργων I_f με παραμέτρους (δυσκολία b_i, διάκριση a_i) βαθμονομημένες από HELD_OUT· η «νομοτέλεια» είναι το προσαρμοσμένο μονότονο μοντέλο θ_f(R) πάνω σε πόρους R = (compute, data, time, Wh) με CI· το ratchet εφαρμόζεται στο ΚΑΤΩ όριο CI· κάθε έργο i με hash στο DataManifest οποιουδήποτε βάρους είναι ΑΚΥΡΟ (μόλυνση διά provenance, όχι εικασία)· η τράπεζα εξελίσσεται από curriculum/ECE έργα με απαντήσεις σε escrow στον HELD_OUT· item exposure control· plateau = ACTIVE UNKNOWN με σχέδιο.", purpose: "Μέτρηση ανάπτυξης ικανότητας (§8 #12): λανθάνουσα ικανότητα ανά οικογένεια με CI, σε σφραγισμένη τράπεζα έργων που εξελίσσεται χωρίς μόλυνση, κανονικοποιημένη ανά compute/δεδομένα/χρόνο/ενέργεια· κάθε ισχυρισμός κέρδους = δέσμευση.", capabilities: [MFA-CAP-100, MFA-CAP-029],
