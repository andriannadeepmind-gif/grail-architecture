        συνείδησης δεν απονέμει αυτόματα operational authority.


        **Συμμετρική αξιολόγηση.** Κάθε πείραμα μπορεί να ενισχύσει, να αποδυναμώσει, να διαψεύσει μία πρόβλεψη ή να μείνει inconclusive (SUPPORTED / WEAKENED / PREDICTION_FALSIFIED
        / INCONCLUSIVE)· μία αποτυχημένη πρόβλεψη δεν διαψεύδει θεωρητική οικογένεια: PREDICTION_FALSIFIED → THEORY_VARIANT_FALSIFIED_WITHIN_GRAIL (μόνο με προκαταχωρισμένο
        σύνολο κρίσιμων προβλέψεων, ≥ 2 ανεξάρτητες επαναλήψεις, αποκλεισμό αποτυχίας οργάνου/operationalization) → THEORY_FAMILY_RETAINS_ALTERNATIVE_VARIANTS. Οι
        γραμμές (f) των §3.1–3.10 διαβάζονται εφεξής ως «FALSIFIED-within-GRAIL της ΠΑΡΑΛΛΑΓΗΣ που τυποποιήθηκε στον host», όχι της οικογένειας.


        **Πρωτόκολλο διαχωρισμού.** Το κριτήριο «διαχωρίσιμη μόνο αν κάθε off-diagonal ∣d∣ < 0,3» αντικαθίσταται από αιτιακό πρωτόκολλο που εκτιμά total effect, controlled
        direct effect, mediated effect, shared-cause effect και measurement-channel effect· οι έννοιες μπορούν να είναι διαφορετικές αλλά αιτιακά συνδεδεμένες· το
        σύστημα δεν ανασχεδιάζεται για να γίνει ο πίνακας διαγώνιος. Οι μοχλοί διορθώθηκαν: agency ≠ εξωτερική άδεια δράσης, reportability capacity ≠ ένα κανάλι εξόδου,
        continuity ≠ καταστροφή key lineage, metacognition ≠ ένα confidence stream· κάθε ablation με construct-validity test.


        **Λοιπά.** Το όριο ενός πειράματος ανά Ω-Loop είναι resource policy (OAP), όχι αναλλοίωτη· UNMEASURABLE = ορθογώνια επιστημική συνθήκη, όχι τιμή κάτω από
        ABSENT (§4.1 Ορισμός 2 διαβάζεται ως διάταξη ΜΕΤΡΗΣΙΜΟΤΗΤΑΣ, όχι τιμής)· bitwise replay μόνο για παγωμένη ντετερμινιστική F1 εκτέλεση, αλλιώς versioned causal
        replay με προκαθορισμένα tolerance bounds (MFA-INV-113 r1). Όλα τα records, experiments και theory modules διατηρούνται.


