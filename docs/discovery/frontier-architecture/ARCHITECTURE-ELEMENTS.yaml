     failure_modes: [{mode: "Collusion E–S", response: "E-scores άκυρες· μόνο H"}, {mode: "Αξιολογητές τετριμμένοι (constant)", response: "απόσυρση από scoring (αρχείο)"}, {mode: "Έργα άλυτα (γεννήτορας «κερδίζει» φθηνά)", response: "REJECTED_UNSOLVABLE· ανταμοιβή μηδέν"}, {mode: "H διαρροή (εκπαιδεύτηκε κατά λάθος)", response: "εποχή άκυρη· MFA-VO-063"}, {mode: "Γενεαλογία άγνωστη (κλειστός πάροχος)", response: "μετρά ως 0 (worst case) — αποκλείεται ως ανεξάρτητος"}], alternatives: ["στατικοί αξιολογητές (0.3.0)", "self-play χωρίς H"], conflicts: [MFA-CFL-041],
