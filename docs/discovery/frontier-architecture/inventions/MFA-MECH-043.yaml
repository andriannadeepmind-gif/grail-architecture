- 'MFA-CON-072 (Twin Execution: load/apply/fork/replay/substitute/inject/risk/pareto/project)'
- MFA-CON-026 (Simulation Harness / World Twin)
- MFA-CON-039 (CGP)
invariants:
- 'MFA-INV-112: κάθε γεγονός στο δίδυμο είναι τυπωμένο από contract και ελέγχεται έναντι κάθε ενεργής εκτελέσιμης αναλλοίωτης· αναλλοίωτη χωρίς predicate δηλώνεται UNMEASURED (ποτέ σιωπηλά PASS)'
- 'MFA-INV-113: replay(log, seeds) αναπαράγει τον κόσμο bitwise ΜΟΝΟ για παγωμένη ντετερμινιστική F1 εκτέλεση (D1)· για στοχαστικά ή hardware-εξαρτώμενα υποστρώματα (D2, F2+) απαιτείται versioned causal
  replay με προκαθορισμένα tolerance bounds ανά κλάση· μετάβαση πιστότητας μόνο με conformance test στο ίδιο contract'
authority_model: Το δίδυμο δεν έχει εξουσία επίδρασης (Genesis)· F4 real-component substitution μόνο με DisclosureGrant/PDP· τα σενάρια δεν φτάνουν Effect· η CGP προβολή προς cockpit.
learning_model: Το δίδυμο δεν μαθαίνει βάρη· τα μοντέλα πιστότητας F2 (DST) και οι mocks βαθμονομούνται από πραγματικά traces (calibration receipts)· η βιβλιοθήκη σεναρίων μεγαλώνει (ATK, ECE έργα).
failure_modes:
- mode: Αναλλοίωτη μη-εκτελέσιμη
  detection: μητρώο
  response: UNMEASURED δηλωμένο (MFA-INV-112)
- mode: Mock που «περνά» τα πάντα
  detection: conformance suite + seeded faults
  response: mock απορρίπτεται
- mode: Μη-ντετερμινισμός (D2 στοιχεία)
  detection: replay hash ≠
  response: στοιχείο σημαίνεται D2· ανοχή δηλωμένη
- mode: Έκρηξη κόσμων
  detection: budget
  response: pruning με Pareto· seeds αποθηκεύονται για re-fork
- mode: Real component με side effects
  detection: F4 χωρίς grant
  response: αδύνατο (Genesis)
containment: Genesis· F4 μόνο με grant· sandbox· seeds/logs ως δεσμεύσεις.
reversibility_class: REVERSIBLE (κόσμοι = fork· τίποτα δεν εκτελείται στο Effect)
resource_complexity: 'F1: Python, ms/γεγονός, laptop· F2: DST λεπτά/σενάριο· F3 shadow: κόστος πραγματικών οργάνων· μνήμη O(|worlds|·|state|) με structural sharing'
scaling_law: Κόστος ~ |events|·|active invariants|· τα δέντρα κόσμων ~ branching^depth (Pareto pruning)· MFA-VO-086 = παραβιάσεις ανιχνευόμενες ανά seeded fault και replay επιτυχία.
verification_strategy: 'MFA-VO-086: TES-E1 (seeded contract/invariant παραβιάσεις ανιχνεύονται 100 %) F1· TES-E2 (replay ντετερμινισμός, fork/merge, fidelity substitution) F1/F2· η ίδια η tools/twin ως
  F1 εκτελέσιμη προδιαγραφή του πακέτου'
experiments:
- id: TES-E1
  design: 'tools/twin: φόρτωση πακέτου, 30 seeded παραβιάσεις (contract signature, precondition, INV predicates, RET escrow)'
  preregistered_criterion: 30/30 ανιχνεύονται με σωστό id· 0 ψευδώς θετικά σε 100 έγκυρα γεγονότα
- id: TES-E2
  design: 1000 τυχαία γεγονότα, fork σε 10 κόσμους, replay από log+seeds· substitution ενός στοιχείου F0→F1
  preregistered_criterion: replay hash = original 100 %· substitution conformance PASS/FAIL σωστά· risk map παράγεται
falsifiers:
