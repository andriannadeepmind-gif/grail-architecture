rationale: 'MFA-ATK-10 (η ισχυρότερη επιζώσα): η κατανομή προτάσεων ήταν νοικιασμένη· ο γνωσιακός πυρήνας δεν είχε ablation obligation· το TEL-05 υποσχόταν πορεία
