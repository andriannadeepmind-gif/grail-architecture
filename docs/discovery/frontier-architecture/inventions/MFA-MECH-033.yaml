invention_id: MFA-MECH-033
name: Sovereignty Transition Protocol (STP) & Sovereignty Index (SI) — από δανεική σε κυρίαρχη νοημοσύνη με πύλες
required_capability:
  caps:
  - MFA-CAP-097
  text: 'Μετάβαση από δανεική σε κυρίαρχη νοημοσύνη (§8 #18): σταδιακή, ανά οικογένεια ικανοτήτων, μετρημένη με δείκτη, με πύλες ισοτιμίας ποιότητας και rollback, μέχρι την πλήρη ανεξαρτησία από παρόχους.'
why_known_methods_are_insufficient: 'Το 0.3.0/0.4.0-provisional λέει «ο πάροχος γίνεται baseline μετά το SMF-E1» (μία πρόταση, AA-025). Αφετηρίες: distillation (Hinton, Vinyals & Dean 2015), self-hosting
  μεταναστεύσεις παρόχων (πρακτική μηχανικής), canary/blue-green cutovers, "model routing" (§4: ≠ κυριαρχία). Όρια: κανένας ορισμός δείκτη κυριαρχίας· καμία σταδιακή πύλη ισοτιμίας σε σφραγισμένα σύνολα
  ανά οικογένεια· καμία καταγραφή ότι το distilled παιδί κληρονομεί γενεαλογία (ώστε ο πάροχος να μην «αξιολογεί» το παιδί του)· καμία διάκριση μεταξύ κυριαρχίας πρότασης, αξιολόγησης, μνήμης, εργαλείων.'
preserved_objective: MFA-OBJ-054 (κυριαρχική μετάβαση) · MFA-OBJ-050 · MFA-OBJ-010 (κυριαρχία) · MFA-CAP-081 · MFA-TEL-08
new_principle: 'Sovereignty Index SI ∈ [0,1]^{families×axes}: ανά οικογένεια ικανοτήτων f και άξονα ∈ {proposal, evaluation, memory, tools}, το ποσοστό VERIFIED εξόδων που παρήχθησαν από κυρίαρχες πηγές
  (WeightCommitments/προγράμματα ιδιόκτητα) ΧΩΡΙΣ απώλεια ποιότητας έναντι του καλύτερου παρόχου σε σφραγισμένο σύνολο (ισοτιμία εντός CI). Στάδια ανά οικογένεια S0 (πάροχος) → S1 (κυρίαρχη σκιά) → S2 (κυρίαρχη
  κύρια, πάροχος fallback) → S3 (πάροχος μόνο ως εξωτερικός αντίπαλος/αξιολογητής όπου lineage-disjoint) → S4 (χωρίς πάροχο)· προκαταχωρισμένες πύλες (MFA-DEC-021) σε N συνεχόμενα cuts· ratchet στην ΠΟΙΟΤΗΤΑ
  (ποτέ υποχώρηση), όχι στο στάδιο (υποχώρηση σταδίου επιτρεπτή και καταγράφεται)· ο πάροχος καταγράφεται στη γενεαλογία κάθε distilled βάρους.'
formal_objects:
- Family f ∈ F (από capability lattice concerns)· Axis x ∈ {proposal, evaluation, memory, tools}
- 'SI_{f,x}(cut) = |{o ∈ VERIFIED_{f,x}(cut) : source(o) ∈ Sovereign}| / |VERIFIED_{f,x}(cut)| υπό συνθήκη parity_{f}(cut) = true'
- 'parity_f(cut): q_sov(f, sealed) ≥ q_prov(f, sealed) − ε με CI (HELD_OUT scorer)'
- Stage_f ∈ {S0..S4}· Gate(S_i→S_{i+1}) = προκαταχωρισμένα κατώφλια SI, parity, N cuts, incident-free
- 'ProviderDependencyRecord: κλήσεις παρόχου/έργο, DisclosureGrants, unlearning obligations από distillation'
- SI_total = weighted mean (βάρη = πολιτική)
state_variables:
- Stage_f,t
- SI_t πίνακας
- Parity_t
- Streak_t (συνεχόμενα cuts που πληρούν πύλη)
- Fallback log
- Lineage flags (distilled από P)
transition_rules:
- 'MEASURE: κάθε cut → SI, parity από HELD_OUT'
- 'ADVANCE: Gate(S_i→S_{i+1}) για N cuts ⇒ Stage_f += 1· receipt'
- 'REGRESS: parity χάνεται ή incident ⇒ Stage_f −= 1 (fallback ενεργό)· ποιότητα ratchet ισχύει'
- 'S3 rule: πάροχος ως αξιολογητής μόνο αν EIM lineage-disjoint από το κυρίαρχο μοντέλο (MFA-INV-089)'
- 'S4: DisclosureGrants προς πάροχο ανακαλούνται· διατήρηση δυνατότητας επαναφοράς (σφραγισμένη)'
algorithms:
- name: STP-Step (ανά οικογένεια, ανά cut)
  complexity: O(|F|·|X|·|sealed|) ανά cut· αμελητέο έναντι εκτέλεσης
  pseudocode: |
    procedure STP_Step(cut):
      for f in Families:
        for x in Axes: SI[f,x] ← sovereign_share(VERIFIED(cut, f, x))
        parity[f] ← HELD_OUT.parity_test(f, sealed_f, sov=SovereignStack, prov=BestProvider, ε, CI)
        g ← Gate[Stage[f]]                                               # thresholds from MFA-DEC-021 (pre-registered)
        if SI[f,:] ≥ g.si ∧ parity[f] ∧ incidents(f, cut) = 0: streak[f] += 1 else streak[f] ← 0
        if streak[f] ≥ g.N and Stage[f] < S4:
          Stage[f] += 1 ; CC.assert(StageAdvance(f, Stage[f], evidence=(SI, parity, streak)))
          if Stage[f] = S2: Router.set_primary(f, Sovereign, fallback=Provider)
          if Stage[f] = S3: Router.set_provider_role(f, EVALUATOR_ONLY if EIM.lineage_disjoint(Provider, Sovereign[f]) else NONE)
          if Stage[f] = S4: Disclosure.revoke(Provider, f) ; keep_sealed_reactivation_path(f)
        elif not parity[f] and Stage[f] ≥ S2:
          Stage[f] −= 1 ; Router.restore_fallback(f) ; CC.assert(StageRegress(f, reason))   # never silent
      CGM.record(SI, cut)                                                # MFA-VO-075
- name: sovereign_share / parity_test
  complexity: O(|outputs|) / O(|sealed|)
  pseudocode: |
    function sovereign_share(outputs):
      return |{o : lineage(source(o)) ⊆ SovereignWeights ∪ SovereignPrograms}| / |outputs|     # distilled weights count as sovereign for share, but lineage keeps P (MFA-INV-089)
    function parity_test(f, sealed, sov, prov, ε, CI):
      q_s ← score(sov, sealed, scorer=HELD_OUT) ; q_p ← score(prov, sealed, scorer=HELD_OUT)
      return lower_CI(q_s − q_p) ≥ −ε                                                   # one-sided non-inferiority
interfaces:
- STP.index(cut)→SI matrix
- STP.stage(family)→Stage
- STP.gates()→Gate table (MFA-DEC-021)
- STP.advance/regress receipts
- STP.dependency(cut)→ProviderDependencyRecord
- STP.reactivation(family)→sealed path
