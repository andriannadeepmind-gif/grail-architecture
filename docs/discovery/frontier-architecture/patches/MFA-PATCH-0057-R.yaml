        οι νέες παρεμβάσεις προτείνονται ως Effects με VOI/κόστος και περνούν από RET (πρώτα Genesis/LWM, μετά REVERSIBLE στο Effect plane, ποτέ IRREVERSIBLE χωρίς
        AutonomyEnvelope)· κάθε αντιπαραγοντική απάντηση φέρει τύπο αβεβαιότητας και επιστρέφει UNKNOWN(CAUSAL_UNDERDETERMINED) με σχέδιο παρεμβάσεων όταν το ερώτημα
        δεν ταυτοποιείται. · ATK-19: στο νομικό πεδίο οι do()-παρεμβάσεις είναι σπάνιες· το CDCE δέχεται φυσικά πειράματα και instrumental variables από τη διακύμανση
        του docket (σύνθεση δικαστηρίων, μεταβολές νόμου με χρονική διάταξη) ως INT-ισοδύναμες ακμές με ετικέτα NAT (ποτέ …

        - **Σκοπός:** Αιτιακή ανακάλυψη (§8 #5) από παρατηρήσεις ΚΑΙ παρεμβάσεις που το ίδιο το σύστημα προτείνει και εκτελεί υπό RET· πλήρης αντιπαραγοντική προσομοίωση
        (§8 #6) με τυπωμένη αβεβαιότητα.

        - **Ικανότητες:** MFA-CAP-090, MFA-CAP-091 · **Προέλευση:** MFA-MECH-027, Ω-MAXIMUM NON-ABSTENTION MANDATE 0.4.0 (creator-authorized) §6/§7/§8, FCI/GIES (Spirtes
        et al. 2000· Hauser & Bühlmann 2012), twin networks (Balke & Pearl 1994)

        - **Υποθέσεις:** faithfulness ανά ακμή ελέγξιμη με παρεμβάσεις

        - **Εξαρτήσεις:** MFA-ELM-001, MFA-ELM-007, MFA-ELM-010, MFA-ELM-019, MFA-ELM-022, MFA-ELM-023, MFA-ELM-098, MFA-ELM-105, MFA-ELM-109, MFA-ELM-111, MFA-ELM-126
        · **Διεπαφές:** MFA-CON-055

        - **Εξουσία:** Ανακάλυψη = Genesis plane χωρίς εξουσία· προτάσεις παρεμβάσεων = Effects μέσω PDP + RET + AutonomyEnvelope· προϋπολογισμοί ανά κλάση = MFA-DEC-025·
        αντιπαραγοντικά προς LPA ως ΠΡΟΒΛΕΨΕΙΣ (Prediction Doctrine MFA-CAP-072), ποτέ ως γεγονότα.

        - **Κατάσταση:** Μεταβλητές: M_t (τρέχον SCM ensemble, B bootstrap δείγματα)· EdgeStatus_t· I_t (παρεμβάσεις που εκτελέστηκαν/εκκρεμούν)· Budget_t (παρεμβάσεις
