# ARCHITECTURE-ELEMENTS — η συνθετική αρχιτεκτονική (Pass F): κάθε υποσύστημα/όργανο/δομή ως στοιχείο με τα 28 πεδία της
# epistemic_status (Ω-ASI 0.4.0 §5, MFA-PATCH-0037): κατάσταση ισχυρισμού ανά στοιχείο· για 001…108 μηχανικά από maturity (T→IMPLEMENTABLE FROM KNOWN COMPONENTS, X→NOVEL SYNTHESIS, R/E→RESEARCH HYPOTHESIS, «δεν ξέρω»→ACTIVE UNKNOWN), για 109…127 από το δοσιέ· τροφοδοτεί τη διάδοση επιστημικού κινδύνου του TES (MFA-MECH-043).
# εντολής §19, αντιστοίχιση προς τα 75 CMP του corpus (corresponds_to) και τύχη Delta Ledger (delta, εντολή §20).
# Copyright (c) 2026 STAVROPOULOS LAW. All Rights Reserved.
#
# Στρώματα (strata) — ΔΕΝ είναι τα 7/13 στρώματα του corpus· είναι το αποτέλεσμα του Pass B/C/F: ό,τι ανήκει στο ίδιο
# plane και έχει το ίδιο fault model και την ίδια εξουσία. Κριτήριο ένταξης (CLAIMS F9 ζητούσε να γραφτεί): ένα στοιχείο
# ανήκει στο στρώμα του οποίου τα contracts καταναλώνει χωρίς να εκθέτει υλοποίηση προς τα κάτω.
#   S0 Substrate (robust, κάθε Telos) · S1 Authority & Effect plane · S2 Genesis plane (νόηση) · S3 Entity (AEO)
#   S4 Collective (Epistemic Commons) · S5 Institutions & Civilizations · S6 LAWMAX (G1) · S7 Evolution & Forge (Meta)
#   S8 Knowledge & Provenance (εγκάρσιο) · S9 Operations & Verification (εγκάρσιο) · S10 Human & Spatial · SX composites
# plane: genesis (σκέψη χωρίς όριο, μέσα σε microVM) · effect (typed, receipts) · both · none (δηλωτικό)
# delta: RETAIN / STRENGTHEN / GENERALIZE / REPLACE / SPLIT / MERGE / MOVE / RESEARCH / PARETO-FORK · NEW = δεν υπήρχε στο corpus
# Οι διεπαφές MFA-CON-001…032 αντιστοιχούν 1:1 στα ICD-01…32 (CONTRACTS.yaml)· 033+ νέες. Οι MFA-VO-001…024 = KT-01…24.

