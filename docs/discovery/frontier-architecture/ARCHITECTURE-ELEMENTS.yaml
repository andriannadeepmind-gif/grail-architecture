      - {phase_id: compile_temporal, provider: MFA-ELM-059, input_type: AttestedSource, precondition: "jurisdiction and dates parsed", contract: MFA-CON-044, obligations: ["validity intervals", "amendment lineage", "exceptions"], budget: compilation, timeout: declared, effect_class: NONE, output_type: LegalDelta, evidence: CompilerReceipt, failure_transition: CONTESTED}
      - {phase_id: integrate_graph, provider: MFA-ELM-080, input_type: LegalDelta, precondition: "bitemporal constraints valid", contract: MFA-CON-017, obligations: ["non-retroactivity", "cross-links", "supersession"], budget: graph, timeout: declared, effect_class: NONE, output_type: NewLegalCut, evidence: GraphReceipt, failure_transition: retain_previous_cut}
      - {phase_id: verify_publish, provider: MFA-ELM-020, input_type: NewLegalCut, precondition: "differential/replay suite", contract: MFA-CON-030, obligations: ["citation/retrieval regression", "release attestation"], budget: release, timeout: declared, effect_class: PUBLICATION, output_type: AdmittedLegalCut, evidence: VerificationReleaseReceipt, failure_transition: withhold_publish}
