  MFA-TEL-05:
    statement: 'TEL-04 + substrate-agnostic αρχιτεκτονική συνείδησης (operational, self-model/reportability, integration, volition — phenomenal claims ως πειράματα),
      μετρημένη πιστότητα self-model, self-directed learning, τεχνολογική επινόηση και επιστημονική ανακάλυψη ως έξοδοι, γενικευμένη κρίση, ηθική θέση οντοτήτων ως
      απόφαση υπό αβεβαιότητα. Ρήτρα 0.4.0 (Ω-ASI mandate, αντικαθιστά τη ρήτρα MFA-ATK-10 του 0.3.0): η ASI δεν είναι «πορεία» — είναι σχεδιασμένη πλήρως: κυρίαρχη
      παραμετρική μάθηση (MFA-MECH-020), ανταμοιβή από επαληθευμένα αντικείμενα (MFA-MECH-021), αναδρομική αυτο-βελτίωση υπό σταθερό σημείο (MFA-MECH-022), μαθημένα
      μοντέλα κόσμου και ανοιχτό curriculum (MFA-MECH-023)· η επιστημική αβεβαιότητα για την έκβαση καταγράφεται στα MFA-UNK-112/113 και δεν μειώνει το εύρος.'
rationale: 'Ο δημιουργός (2026-09-16): «η ASI έχει ήδη οριστεί ως υποχρεωτικό frontier· δεν ζητείται νέα ετυμηγορία»· το 0.3.0 είχε αποχή (πορεία, PDE ως router,
  ALT-7 απομονωμένη, DEC-X-19 ως απαγόρευση, συνείδηση ως σύντομο πρόγραμμα, toolchain ως kernel).'
