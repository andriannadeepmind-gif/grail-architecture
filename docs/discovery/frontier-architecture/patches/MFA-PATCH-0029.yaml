  MFA-MECH-031:
    _add: true
    name: Evaluator Co-Evolution under EIM (ECE) — δύο πληθυσμοί, μετρημένη ανεξαρτησία, αντιπαλική αυτο-πρόκληση
    maturity: X
    dossier: mechanisms/MFA-MECH-031.md
    statement: 'Δύο πληθυσμοί (λύτες S, αξιολογητές E) + μία περιστρεφόμενη παγωμένη υποομάδα H (HELD_OUT) που ΔΕΝ εκπαιδεύεται ποτέ μέσα στην εποχή. Κανόνας γενεαλογίας:
      distilled(P) ⇒ lineage ∋ P· αξιολογητής με IndependenceVector κάτω από κατώφλι ως προς έναν λύτη αποκλείεται από τη βαθμολόγησή του (αρχειοθετείται, δεν διαγράφεται).
      Fitness αξιολογητή = διακριτική ισχύς σε seeded faults + proper score έναντι H-ετικετών − συσχέτιση σφαλμάτων με λύτες· fitness λύτη = H-επαληθευμένη βαθμολογία
      (ποτέ μόνο E). Αντιπαλική αυτο-πρόκληση: οι E γεννούν έργα που μεγιστοποιούν σφάλμα λύτη υπό συνθήκη επιλυσιμότητας (ασύμμετρη ανταμοιβή), τροφοδοτώντας το
      curriculum.'
    purpose: 'Ανεξαρτησία αξιολογητών (§8 #13) και αντιπαλική αυτο-πρόκληση (§8 #14): αξιολογητές που εξελίσσονται μαζί με τους λύτες χωρίς να γίνονται συνένοχοί
      τους, και γεννούν τα έργα που τους αποκαλύπτουν.'
