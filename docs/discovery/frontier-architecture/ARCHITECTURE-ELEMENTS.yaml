      data_dependencies: ["AttestedSource→LegalDelta→NewLegalCut→AdmittedLegalCut is type-continuous", "prior corpus cut is immutable and any published result points back to it"]
      forks: ["independent sources/jurisdictions compile in named branches against the same prior cut"]
      joins: ["integrate_graph joins only non-overlapping or explicitly contested deltas; verify_publish joins replay, citation and release evidence"]
      loops: ["correction/amendment is a new bitemporal delta, never mutation of prior valid-time history"]
      cancellation: "cancelled/quarantined source branch stays preserved and cannot partially update the admitted graph"
      progress_or_variant: "finite source batch and compiler stages; unresolved collision terminates CONTESTED/WITHHELD"
    input_cut: "prior corpus + raw new source + temporal/identity cut"
    authority_path: "source authority → compiler evidence → release authority"
    obligation_path: "source/temporal/citation/release obligations"
    resource_envelope: "incremental compile with full replay on high-risk deltas"
    success_predicate: "new legal cut reproducible to raw source with temporal semantics and signed release attestation"
