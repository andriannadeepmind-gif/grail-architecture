    input_cut: "predecessor + candidate + Telos/Root + crypto epoch"
    authority_path: "HELD_OUT + Court + Creator for irreversible cutover"
    obligation_path: "four certificates + migration + post-cutover observation"
    resource_envelope: "dual-system escrow"
    success_predicate: "verified successor, explicit continuity/new identity, preserved Root/Telos and recoverable cutover"
    terminal_states: [SUCCESSOR_ACTIVE, CANARY, REJECTED, ABORTED_RESTORED, CREATOR_REQUIRED]
